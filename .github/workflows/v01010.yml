name: Build Darkroom Timer v0.10.10

on:
  push:
    branches: [ feature-v01010-timer-splitgrade-provini ]
    paths-ignore:
      - 'experiments/v01010/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature-v01010-timer-splitgrade-provini

      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v01010
          printf 'run_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > experiments/v01010/latest_run.txt
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v01010/latest_run.txt
          git commit -m "Record v0.10.10 build run [skip ci]"
          git push origin HEAD:feature-v01010-timer-splitgrade-provini

      - name: Prepare clean Darkroom base
        shell: bash
        run: |
          set -euo pipefail
          test -d base/v0.7.7/project
          rm -rf work && mkdir -p work
          cp -a base/v0.7.7/project work/project
          cp base/v0.7.7/build_darkroom.py work/build_darkroom.py
          cp base/v0.7.7/v064_icon.py work/v064_icon.py

      - name: Apply Timer releases v0.8.0 through v0.10.5
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v080/prepare_v080_transform.py
          python3 -m py_compile experiments/v080/apply_v080_print_sequence.py experiments/v080/apply_v080_fixups.py
          python3 experiments/v080/apply_v080_print_sequence.py work
          python3 experiments/v080/apply_v080_fixups.py work
          python3 experiments/v081/prepare_v081_transform.py
          python3 -m py_compile experiments/v081/apply_v081_print_plan_polish.py
          python3 experiments/v081/apply_v081_print_plan_polish.py work
          python3 experiments/v090/prepare_v090_transform.py
          python3 -m py_compile experiments/v090/apply_v090_split_grade.py experiments/v090/apply_v090_fixups.py
          python3 experiments/v090/apply_v090_split_grade.py work
          python3 experiments/v090/apply_v090_fixups.py work
          python3 experiments/v091/prepare_v091_transform.py
          python3 -m py_compile experiments/v091/apply_v091_timing_voice_polish.py
          python3 experiments/v091/apply_v091_timing_voice_polish.py work
          python3 experiments/v0100/prepare_v0100_transform.py
          python3 -m py_compile experiments/v0100/apply_v0100_pro_recipe.py
          python3 experiments/v0100/apply_v0100_pro_recipe.py work
          python3 experiments/v0101/prepare_v0101_transform.py
          python3 -m py_compile experiments/v0101/apply_v0101_stability_ux.py
          python3 experiments/v0101/apply_v0101_stability_ux.py work
          python3 experiments/v0102/prepare_v0102_transform.py
          python3 -m py_compile experiments/v0102/apply_v0102_test_fixes.py
          python3 experiments/v0102/apply_v0102_test_fixes.py work
          python3 experiments/v0103/prepare_v0103_transform.py
          python3 -m py_compile experiments/v0103/apply_v0103_split_short_exposure.py
          python3 experiments/v0103/apply_v0103_split_short_exposure.py work
          python3 experiments/v0104/prepare_v0104_transform.py
          python3 -m py_compile experiments/v0104/apply_v0104_dodge_burn_voice.py
          python3 experiments/v0104/apply_v0104_dodge_burn_voice.py work
          python3 -m py_compile experiments/v0105/apply_v0105_premature_off_failsafe.py
          python3 experiments/v0105/apply_v0105_premature_off_failsafe.py work

      - name: Apply Darkroom Assistant releases 1 through 4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0106/apply_v0106_darkroom_assistant_r1.py
          python3 experiments/v0106/apply_v0106_darkroom_assistant_r1.py work
          python3 -m py_compile experiments/v0107/apply_v0107_darkroom_assistant_r2.py
          python3 experiments/v0107/apply_v0107_darkroom_assistant_r2.py work
          python3 -m py_compile experiments/v0108/apply_v0108_darkroom_assistant_r3.py
          python3 experiments/v0108/apply_v0108_darkroom_assistant_r3.py work
          python3 -m py_compile experiments/v0109/apply_v0109_darkroom_assistant_r4.py
          python3 experiments/v0109/apply_v0109_darkroom_assistant_r4.py work

      - name: Apply v0.10.10 Timer update
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v01010/apply_v01010_timer_splitgrade_provini.py
          python3 experiments/v01010/apply_v01010_timer_splitgrade_provini.py work

      - name: Verify requested Timer changes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/project/app/src/main')
          java=root/'java/it/darkroom/timer'
          main=(java/'MainActivity.java').read_text(encoding='utf-8')
          split=(java/'SplitGradePlan.java').read_text(encoding='utf-8')
          service=(java/'SonoffArmService.java').read_text(encoding='utf-8')
          manifest=(root/'AndroidManifest.xml').read_text(encoding='utf-8')

          # 1-3: Split Grade Foma Variant + Meopta, valori editabili e spiegazione non invasiva.
          assert 'public int softYellow = 60;' in split
          assert 'public int hardMagenta = 180;' in split
          assert 'softYellow + "Y / 0M' in split
          assert '"SPLIT · DURA · 0Y / " + hardMagenta + "M' in split
          assert 'syMinus.setOnClickListener' in main and 'syPlus.setOnClickListener' in main
          assert 'hmMinus.setOnClickListener' in main and 'hmPlus.setOnClickListener' in main
          assert 'ⓘ  COME FUNZIONA' in main
          assert 'Le due esposizioni NON sono indipendenti' in main
          assert 'giallo = solo luci' in main and 'magenta = solo ombre' in main

          # 4: stampa normale -> provino, tempo/metodo/passo preservati.
          assert 'NUOVO PROVINO DA QUESTA STAMPA' in main
          assert 'testWidthMs = snap(printWidthMs, 500, 36_000_000);' in main
          assert 'getSharedPreferences("ui", MODE_PRIVATE).edit()' in main
          assert 'if (!testFromPrint) return TimingMath.cumulativeSeries' in main
          assert 'first + i * 500' in main
          assert 'TimingMath.cumulativeFStopSeries(testWidthMs, testCount)' in main
          assert 'TimingMath.stepLabel(timingMethod)' in main

          # 5: split resta separato nel piano, non convertito in un equivalente singolo.
          assert 'printSequence.split.softLine()' in main
          assert 'printSequence.split.hardLine()' in main
          assert 'nessuna conversione in esposizione singola' in main
          assert 'printSequence = new PrintSequence()' in main or 'PrintSequence printSequence' in main

          # 6: percorso storico PROVINO -> STAMPA ancora presente.
          chooser=main[main.index('private void maybeShowTestResultChooser()'):]
          assert 'setMode(MODE_PRINT);' in chooser
          assert 'setPrintTime(imported);' in chooser

          # 7: correzioni di stampa e sequenza restano presenti.
          for needle in ['showPrintCorrectionEditor', 'persistPrintSequence', 'DODGE', 'BURN']:
              assert needle in main

          # SONOFF/timer service non viene sostituito da questa release: build completa lo ricompila.
          for needle in ['ACTION_ARM_PRINT','ACTION_ARM_TEST','EXTRA_TEST_TARGETS','ACTION_CANCEL']:
              assert needle in service
          assert 'android:versionCode="55"' in manifest and 'android:versionName="0.10.10"' in manifest
          print('v0.10.10 acceptance/regression checks OK')
          PY

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          print(re.search(r'android:versionName="([^"]+)"',t).group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          test "$VERSION_NAME" = "0.10.10"

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare stable signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          python3 work/build_darkroom.py work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "DarkroomTimer-DIY-v${VERSION_NAME}.apk" | head -30
          sha256sum "DarkroomTimer-DIY-v${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk
