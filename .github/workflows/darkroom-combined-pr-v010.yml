name: Build Darkroom Combined v0.1.0 FINAL

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-darkroom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Prepara firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Costruisci app combinata
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sed -i 's/adst_assistant_java/dst_assistant_java/g' combined/prepare_combined.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('combined/prepare_combined.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('# onCreate: apre direttamente la sezione richiesta dalla Home unica.')
          end=s.index('# Back = Home unica.', start)
          block=r'''# onCreate: conserva tutte le inizializzazioni della v0.3.8 e sostituisce
          # soltanto la showHome finale con il routing dalla Home combinata.
          on_start = s.index('    @Override\n    protected void onCreate(Bundle savedInstanceState) {')
          on_end = s.index('\n    @Override', on_start + 20)
          on_seg = s[on_start:on_end]
          old_home = '        showHome();'
          if old_home not in on_seg:
              raise SystemExit('Assistant onCreate showHome marker missing')
          route = ''' + "'''" + '''        String target = getIntent().getStringExtra("darkroom_target");
                  if ("products".equals(target)) showProducts();
                  else if ("film".equals(target)) showFilm();
                  else if ("paper".equals(target)) showPaper();
                  else finish();''' + "'''" + r'''
          on_seg = on_seg.replace(old_home, route, 1)
          s = s[:on_start] + on_seg + s[on_end:]

          '''
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          bash combined/ci_build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-v0.1.0
          path: |
            Darkroom-v0.1.0.apk
            Darkroom-v0.1.0.sha256
