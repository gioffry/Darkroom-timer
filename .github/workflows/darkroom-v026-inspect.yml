name: Inspect Darkroom v0.2.5 for v0.2.6

on:
  push:
    branches:
      - feature-darkroom-v026-print-splitgrade-integration
    paths-ignore:
      - 'build-output/v026-inspect/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-darkroom-v026-print-splitgrade-integration
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Reconstruct verified v0.2.5 source
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat combined/v015_assets/home_bottom_parts/00.part combined/v015_assets/home_bottom_parts/01.part combined/v015_assets/home_bottom_parts/02.part combined/v015_assets/home_bottom_parts/03.part > combined/v015_assets/home_bottom.jpg
          bash combined/build_v025.sh >/tmp/v026-inspect-build.log 2>&1
          test -f combined/src/main/java/it/darkroom/timer/MainActivity.java

      - name: Save source snapshot
        run: |
          set -euo pipefail
          OUT=build-output/v026-inspect
          JAVA=combined/src/main/java/it/darkroom/timer
          mkdir -p "$OUT"
          cp "$JAVA/MainActivity.java" "$OUT/MainActivity-v025.java.txt"
          for f in SplitGradePlan.java PrintSequence.java TimingMath.java SonoffArmService.java LogEntry.java LogStore.java ExposureRecipe.java; do
            if [ -f "$JAVA/$f" ]; then cp "$JAVA/$f" "$OUT/$f.txt"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-output/v026-inspect/MainActivity-v025.java.txt')
          s=p.read_text(encoding='utf-8')
          keys=['showPrintSequenceDialog','showSplitGradeEditor','buildPrintPanel','updatePrintSequenceUi','validatePrintSequenceForBase','maybeShowTestResultChooser','showSplitSoftChooser','showSplitHardChooser','createSplitGradePrintFromProvino','returnPrintToTest','newEntryFromSession','useLogEntryForPrint','showLogEditor','persistPrintSequence','applyModeUi','arm()']
          lines=s.splitlines(); out=[]
          for key in keys:
              out.append('\n===== '+key+' =====')
              hits=[i for i,line in enumerate(lines) if key in line]
              for i in hits[:12]:
                  a=max(0,i-18); b=min(len(lines),i+95)
                  out.append('\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
          Path('build-output/v026-inspect/relevant-snippets.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          grep -nEi 'cyan|ciano|splitPhasePrompt|speak|tts|seconds\(|secondi| s\"| s\)' "$JAVA/SonoffArmService.java" > "$OUT/voice-search.txt" || true

      - name: Publish snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/v026-inspect
          git commit -m "Capture v0.2.5 source for v0.2.6 implementation [skip ci]" || exit 0
          git push origin HEAD:feature-darkroom-v026-print-splitgrade-integration
