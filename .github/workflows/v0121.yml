name: Build Darkroom Timer v0.12.1

on:
  push:
    branches: [ feature-v0121-assistant-ux-smart-catalog ]
    paths-ignore:
      - 'experiments/v0121/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darkroom-v0121-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v0.12.1 branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0121-assistant-ux-smart-catalog
          fetch-depth: 0

      - name: Prove direct genealogy from exact v0.12.0 HEAD
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=3f820cea9f53f9196e81bd05d552679b31177249
          git fetch origin feature-v0120-darkroom-assistant-r7-r8-r9
          BASE_HEAD=$(git rev-parse origin/feature-v0120-darkroom-assistant-r7-r8-r9)
          test "$BASE_HEAD" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          MERGE_BASE=$(git merge-base "$BASE_HEAD" HEAD)
          test "$MERGE_BASE" = "$BASE_HEAD"
          FIRST_NEW=$(git rev-list --reverse "$BASE_HEAD"..HEAD | sed -n '1p')
          test -n "$FIRST_NEW"
          test "$(git rev-parse "$FIRST_NEW^")" = "$BASE_HEAD"
          {
            echo "base_branch=feature-v0120-darkroom-assistant-r7-r8-r9"
            echo "base_head=$BASE_HEAD"
            echo "merge_base=$MERGE_BASE"
            echo "first_v0121_commit=$FIRST_NEW"
            echo "functional_commit=$GITHUB_SHA"
          } | tee genealogy.txt
          echo "BASE_HEAD=$BASE_HEAD" >> "$GITHUB_ENV"
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

      - name: Start exclusively from protected materialized v0.12.0
        shell: bash
        run: |
          set -euo pipefail
          SNAP=base/v0.12.0-materialized
          test -d "$SNAP/project"
          grep -q '^versionName=0.12.0$' "$SNAP/BASE_PROVENANCE.txt"
          grep -q '^versionCode=57$' "$SNAP/BASE_PROVENANCE.txt"
          grep -q '^base_head=3f820cea9f53f9196e81bd05d552679b31177249$' "$SNAP/BASE_PROVENANCE.txt"
          grep -q '^assistant_schema=3$' "$SNAP/BASE_PROVENANCE.txt"
          rm -rf work && mkdir -p work
          cp -a "$SNAP/project" work/project
          cp "$SNAP/build_darkroom.py" work/build_darkroom.py
          cp "$SNAP/v064_icon.py" work/v064_icon.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/project');java=root/'app/src/main/java/it/darkroom/timer'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text();main=(java/'MainActivity.java').read_text();schema=(java/'assistant/data/AssistantDataSchema.java').read_text()
          assert 'android:versionName="0.12.0"' in manifest and 'android:versionCode="57"' in manifest
          assert 'private static final String APP_VERSION = "0.12.0";' in main
          assert 'testFromPrint' not in main and 'NUOVO PROVINO DA QUESTA STAMPA' not in main
          assert 'public static final int VERSION = 3;' in schema
          print('Protected v0.12.0 snapshot accepted as sole functional base')
          PY

      - name: Apply v0.12.1 UX Smart Search and Smart Catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py experiments/v0121/catalog_data.py experiments/v0121/test_upgrade_v0120_to_v0121.py
          python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work

      - name: Test real Smart Search engine and ranking
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/smartclasses /tmp/smartsrc && mkdir -p /tmp/smartclasses /tmp/smartsrc/it/darkroom/timer/assistant/search
          cp work/project/app/src/main/java/it/darkroom/timer/assistant/search/SmartSearchEngine.java /tmp/smartsrc/it/darkroom/timer/assistant/search/
          cat >/tmp/smartsrc/TestSmart.java <<'JAVA'
          import java.util.*;
          import it.darkroom.timer.assistant.search.SmartSearchEngine;
          public class TestSmart {
            static SmartSearchEngine.Item x(String id,String name,String maker,String[] cats,String[] aliases,boolean remote){return new SmartSearchEngine.Item(id,name,maker,Arrays.asList(cats),Arrays.asList(aliases),"","",name,remote);}
            static String first(List<SmartSearchEngine.Item> all,String q,String cat){List<SmartSearchEngine.Result> r=SmartSearchEngine.search(all,q,cat,8);if(r.isEmpty())throw new RuntimeException("no result "+q);return r.get(0).item.name;}
            public static void main(String[] a){
              List<SmartSearchEngine.Item> all=new ArrayList<>();
              all.add(x("fu","FOMA Universal","FOMA",new String[]{"FILM_DEVELOPER"},new String[]{"foma universal developer","foma un"},false));
              all.add(x("fur","FOMA Universal Extra","FOMA",new String[]{"FILM_DEVELOPER"},new String[]{"universal extra"},false));
              all.add(x("d76","KODAK D-76","KODAK",new String[]{"FILM_DEVELOPER"},new String[]{"d76","d-76","d 76"},false));
              all.add(x("hp5","ILFORD HP5 PLUS","ILFORD",new String[]{"FILM"},new String[]{"hp5","hp5+","hp 5"},false));
              all.add(x("trix","KODAK TRI-X 400","KODAK",new String[]{"FILM"},new String[]{"tri x","trix","tri-x"},false));
              for(String n:new String[]{"1510","1520","1540","2520","2540","2550"})all.add(x("j"+n,"JOBO "+n,"JOBO",new String[]{"TANK"},new String[]{n,"jobo "+n.substring(0,2)},false));
              all.add(x("online","FOMA Universal Online Extra","FOMA",new String[]{"FILM_DEVELOPER"},new String[]{"foma un"},true));
              if(!first(all,"foma un","FILM_DEVELOPER").equals("FOMA Universal"))throw new RuntimeException("foma un");
              if(!first(all,"FOMA UNIVERSAL","FILM_DEVELOPER").equals("FOMA Universal"))throw new RuntimeException("exact");
              for(String q:new String[]{"d76","d-76","d 76"})if(!first(all,q,"FILM_DEVELOPER").equals("KODAK D-76"))throw new RuntimeException(q);
              if(!first(all,"hp5","FILM").equals("ILFORD HP5 PLUS"))throw new RuntimeException("hp5");
              if(!first(all,"tri x","FILM").equals("KODAK TRI-X 400"))throw new RuntimeException("tri x");
              if(!first(all,"2520","TANK").equals("JOBO 2520"))throw new RuntimeException("2520");
              if(SmartSearchEngine.search(all,"jobo","TANK",8).size()<2)throw new RuntimeException("jobo must return multiple");
              if(!first(all,"FOMA Universal","FILM_DEVELOPER").equals("FOMA Universal"))throw new RuntimeException("exact must beat partial");
              System.out.println("foma un -> FOMA Universal");
              System.out.println("d76/d-76/d 76 -> KODAK D-76");
              System.out.println("hp5 -> ILFORD HP5 PLUS; tri x -> KODAK TRI-X 400; 2520 -> JOBO 2520; jobo -> multiple: PASS");
            }
          }
          JAVA
          javac -d /tmp/smartclasses /tmp/smartsrc/it/darkroom/timer/assistant/search/SmartSearchEngine.java /tmp/smartsrc/TestSmart.java
          java -cp /tmp/smartclasses TestSmart | tee smart-search-tests.txt

      - name: Test real catalog schema data aliases checksums update rollback cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,tempfile,shutil
          from pathlib import Path
          def load(path):
              r=json.loads(Path(path).read_text(encoding='utf-8'));p=r['payload'];compact=json.dumps(p,ensure_ascii=False,separators=(',',':'));assert hashlib.sha256(compact.encode()).hexdigest()==r['payloadSha256'];assert r['schemaVersion']==2;return r
          local=load('experiments/v0121/catalog-v2.json');remote=load('catalog/catalog-v3.json')
          L=local['payload']['records'];R=remote['payload']['records'];assert local['catalogVersion']==2 and remote['catalogVersion']==3;assert len(L)==32 and len(R)==37
          films=[r for r in L if 'FILM' in r['categories']];devs=[r for r in L if 'FILM_DEVELOPER' in r['categories']];tanks=[r for r in L if 'TANK' in r['categories']]
          assert len(films)==7 and len(devs)==12 and len(tanks)==6
          assert [r['name'] for r in tanks]==['JOBO 1510','JOBO 1520','JOBO 1540','JOBO 2520','JOBO 2540','JOBO 2550']
          by={r['id']:r for r in L};assert {'d76','d-76','d 76'}<=set(by['dev-kodak-d76']['aliases']);assert 'foma un' in by['dev-foma-universal']['aliases'];assert 'tri x' in by['film-trix400']['aliases'];assert len(local['payload']['sources'])>=15
          assert 'cpe2Compatible' not in by['tank-jobo-1510']['technical']  # unknown omitted, not false
          assert by['tank-jobo-2540']['technical']['capacityDataType']=='CALCOLO'
          # Atomic update simulation: validate staged v3 before replacing v2; corrupt candidate cannot touch active.
          with tempfile.TemporaryDirectory() as td:
              td=Path(td);active=td/'catalog.active.json';prev=td/'catalog.previous.json';tmp=td/'catalog.tmp.json';active.write_text(json.dumps(local),encoding='utf-8');tmp.write_text(json.dumps(remote),encoding='utf-8');load(tmp);active.rename(prev);tmp.rename(active);assert json.loads(active.read_text())['catalogVersion']==3 and json.loads(prev.read_text())['catalogVersion']==2
              corrupt=json.loads(active.read_text());corrupt['payload']['records'][0]['name']='CORRUPT';candidate=td/'corrupt.json';candidate.write_text(json.dumps(corrupt),encoding='utf-8')
              try:load(candidate);raise AssertionError('corrupt checksum accepted')
              except AssertionError:pass
              assert json.loads(active.read_text())['catalogVersion']==3
              # selected online technical record cache: technical only, no inventory fields.
              extra=next(r for r in R if r['id']=='dev-fomadon-p');cache={'schemaVersion':1,'records':[extra]};assert 'remaining_amount' not in json.dumps(cache) and cache['records'][0]['name']=='FOMADON P'
          print('Catalog v2 local:',len(L),'records · films',len(films),'developers',len(devs),'tanks',len(tanks))
          print('Catalog v3 remote:',len(R),'records · checksum/update/rollback/cache: PASS')
          PY

      - name: Test modern UX search selection catalog merge offline fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/project/app/src/main/java/it/darkroom/timer/assistant')
          search=(root/'search/SmartSearchActivity.java').read_text();engine=(root/'search/SmartSearchEngine.java').read_text();catalog=(root/'search/SmartCatalog.java').read_text();ui=(root/'ui/AssistantUi.java').read_text();chem=(root/'chemistry/inventory/MyChemistryActivity.java').read_text();equip=(root/'equipment/MyEquipmentActivity.java').read_text();newdev=(root/'development/NewDevelopmentActivity.java').read_text();paper=(root/'paper/PaperChemistryActivity.java').read_text();dm=(root/'system/DataManagementActivity.java').read_text();manager=(root/'system/CatalogManager.java').read_text()
          assert 'DEBOUNCE_MS=350' in search and 'generation' in search and 'handler.removeCallbacks' in search and 'fetchRemoteForSearch' in search
          assert 'localItems(this)' in search and 'RISULTATI ONLINE' in search and 'RISULTATI LOCALI' in search
          for n in ['exact','alias','startsWith','allWords','remote']:
              assert n in engine,n
          assert 'readActiveCatalog' in catalog and 'cachedSelectedRecords' in catalog and 'onlineItems' not in manager
          assert 'SEARCH_CACHE_MS=5*60*1000L' in manager and 'catalog.previous.json' in manager and 'cacheSelectedRecord' in manager
          assert 'Nome rivelatore esatto dal catalogo' not in chem and 'SmartSearchActivity.class' in chem and chem.count('new AlertDialog.Builder')<=1
          assert 'AGGIUNGI TANK DAL CATALOGO · JOBO 2520' not in equip and 'AGGIUNGI TANK' in equip and 'SmartSearchActivity.class' in equip and 'new AlertDialog.Builder' not in equip
          assert 'SmartSearchBinder.attach' in newdev and 'PICK_FILM_CATALOG' in newdev and 'OwnedTankPickerActivity.class' in newdev and 'new android.app.AlertDialog.Builder' not in newdev
          assert paper.count('SmartSearchActivity.class')>=1 and paper.count('new AlertDialog.Builder')<=1
          assert 'PROVENIENZA DEI DATI' in dm and 'showSourcesInline' in dm
          for n in ['card(','primaryButton(','searchField(','resultRow(','emptyState(']:assert n in ui,n
          print('UX: search/ranking/selection/catalog merge/offline fallback/progressive disclosure guards: PASS')
          PY

      - name: Test v0.12.0 to v0.12.1 SQLite preservation and R2-R9 core regression
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0121/test_upgrade_v0120_to_v0121.py work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('base/v0.12.0-materialized/project/app/src/main/java/it/darkroom/timer/assistant');f=Path('work/project/app/src/main/java/it/darkroom/timer/assistant')
          unchanged=['development/DevelopmentCatalog.java','chemistry/ChemistryCalculator.java','data/AssistantDatabase.java','data/AssistantDataSchema.java','recipes/MyRecipesActivity.java','log/DevelopmentLogActivity.java','operational/OperationalAssistantActivity.java','paper/PaperChemistryStore.java','paper/PaperProductData.java','system/DataProvenance.java']
          for rel in unchanged:
              assert hashlib.sha256((b/rel).read_bytes()).digest()==hashlib.sha256((f/rel).read_bytes()).digest(),rel
          planner=(f/'equipment/TankPlanner.java').read_text();assert 'chimica insufficiente' in planner and 'CPE2_MAX_ML' in planner and 'compatibilità JOBO CPE2 non documentata / non confermata' in planner
          backup=(f/'system/BackupEngine.java').read_text();assert 'APP_VERSION="0.12.1"' in backup and 'VERSION_CODE=58' in backup and 'CATALOG_VERSION=2' in backup and 'beginTransaction' in backup and 'CONFLICT_IGNORE' in backup
          assert 'DROP TABLE' not in (f/'data/AssistantDataSchema.java').read_text() and 'DROP TABLE' not in (f/'data/AssistantDatabase.java').read_text()
          print('R2-R9 technical engines/data separation/backup/operational assistant regression: PASS')
          PY

      - name: Test Timer Split Grade SONOFF f-stop and log absolute regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('base/v0.12.0-materialized/project/app/src/main/java/it/darkroom/timer');f=Path('work/project/app/src/main/java/it/darkroom/timer')
          for name in ['SonoffArmService.java','SplitGradePlan.java','TimingMath.java','LogEntry.java','LogStore.java','ExposureRecipe.java','PrintSequence.java']:
              assert hashlib.sha256((b/name).read_bytes()).digest()==hashlib.sha256((f/name).read_bytes()).digest(),name
          main=(f/'MainActivity.java').read_text();service=(f/'SonoffArmService.java').read_text();split=(f/'SplitGradePlan.java').read_text()
          for n in ['testFromPrint','NUOVO PROVINO DA QUESTA STAMPA','returnPrintToTest','testMigrationSummary']:assert n not in main,n
          for n in ['maybeShowTestResultChooser','setMode(MODE_PRINT);','showPrintCorrectionEditor','DODGE','BURN','TimingMath.cumulativeSeries(timingMethod, testWidthMs, testCount)']:assert n in main,n
          for n in ['ACTION_ARM_PRINT','ACTION_ARM_TEST','EXTRA_TEST_TARGETS','ACTION_CANCEL']:assert n in service,n
          assert 'public int softYellow = 60;' in split and 'public int hardMagenta = 180;' in split
          assert '"Azzera il magenta e imposta giallo " + softYellow' in split and '"Azzera il giallo e imposta magenta " + hardMagenta' in split
          print('Timer/STAMPA/PROVINO/Split Grade/sec-fstop/corrections/SONOFF/pulsante/log: PASS')
          PY
          rm -rf /tmp/splitclasses /tmp/splitsrc && mkdir -p /tmp/splitclasses /tmp/splitsrc/it/darkroom/timer
          cp work/project/app/src/main/java/it/darkroom/timer/TimingMath.java work/project/app/src/main/java/it/darkroom/timer/SplitGradePlan.java /tmp/splitsrc/it/darkroom/timer/
          cat >/tmp/splitsrc/TestSplit.java <<'JAVA'
          import it.darkroom.timer.SplitGradePlan; public class TestSplit { public static void main(String[] a){SplitGradePlan p=new SplitGradePlan();if(p.softYellow!=60||p.hardMagenta!=180)throw new RuntimeException();if(!p.softPrompt().equals("Azzera il magenta e imposta giallo 60. Poi premi il pulsante."))throw new RuntimeException();if(!p.hardPrompt().equals("Azzera il giallo e imposta magenta 180. Poi premi il pulsante."))throw new RuntimeException();p.softYellow=50;p.hardMagenta=160;if(!p.softPrompt().contains("giallo 50.")||!p.hardPrompt().contains("magenta 160."))throw new RuntimeException();System.out.println("Split Grade defaults + dynamic TTS: PASS");}}
          JAVA
          javac -d /tmp/splitclasses /tmp/splitsrc/it/darkroom/timer/TimingMath.java /tmp/splitsrc/it/darkroom/timer/SplitGradePlan.java /tmp/splitsrc/TestSplit.java
          java -cp /tmp/splitclasses TestSplit

      - name: Read and verify final version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('work/project/app/src/main/AndroidManifest.xml').read_text();print(re.search(r'android:versionName="([^"]+)"',t).group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          test "$VERSION_NAME" = "0.12.1"
          grep -q 'android:versionCode="58"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'package="it.darkroom.timer"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'public static final int VERSION = 3;' work/project/app/src/main/java/it/darkroom/timer/assistant/data/AssistantDataSchema.java
          cat > validation-report.txt <<'EOF'
          Assistant=9/9
          UX_modernization=PASS
          Smart_Search=PASS
          Smart_Search_aliases=PASS
          Smart_Search_ranking=PASS
          Local_Catalog=32_records
          Remote_Catalog=37_records
          Films=7
          Film_Developers=12
          JOBO_Tanks=6
          Catalog_checksum=PASS
          Catalog_atomic_update_rollback=PASS
          Catalog_selected_record_cache=PASS
          Offline_first=PASS
          SQLite_v0120_to_v0121=PASS
          databaseSchema=3
          R2_R9_regression=PASS
          Timer_regression=PASS
          STAMPA_TO_PROVINO_REMOVAL=PASS
          SplitGrade_TTS_dynamic=PASS
          package=it.darkroom.timer
          versionName=0.12.1
          versionCode=58
          catalogBuiltinVersion=2
          catalogRemoteVersion=3
          EOF

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK on GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare same stable signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build sign zipalign verify package version certificate and SHA-256
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          python3 work/build_darkroom.py work/project --output "$APK" --keystore "$RUNNER_TEMP/darkroom-signing.p12" --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK" | tee zipalign.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee certificate.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='it.darkroom.timer' versionCode='58' versionName='0.12.1'" apk-badging.txt
          sha256sum "$APK" | tee apk.sha256
          APK_SHA=$(cut -d' ' -f1 apk.sha256)
          CERT_FP=$(grep -m1 'certificate SHA-256 digest:' certificate.txt | sed 's/.*: *//')
          test "$CERT_FP" = "fbead305657584b50a9d8892aa19bd9844b412d77db316e7daa5593c94e2a02f"
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "CERT_FP=$CERT_FP" >> "$GITHUB_ENV"
          {
            echo "Build=SUCCESS"
            echo "zipalign=SUCCESS"
            echo "signature=SUCCESS"
            echo "certificate_continuity_v0120=PASS"
            echo "certificate_SHA256=$CERT_FP"
            echo "apk_SHA256=$APK_SHA"
            echo "artifact=DarkroomTimer-DIY-v0.12.1"
          } >> validation-report.txt

      - name: Upload final APK and verification report
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v0.12.1
          path: |
            DarkroomTimer-DIY-v0.12.1.apk
            apk.sha256
            certificate.txt
            zipalign.txt
            apk-badging.txt
            genealogy.txt
            smart-search-tests.txt
            validation-report.txt

      - name: Record successful run metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p experiments/v0121
          cat > experiments/v0121/latest_run.txt <<EOF
          run_id=$GITHUB_RUN_ID
          base_branch=feature-v0120-darkroom-assistant-r7-r8-r9
          base_head=$BASE_HEAD
          new_branch=feature-v0121-assistant-ux-smart-catalog
          merge_base=$MERGE_BASE
          functional_commit=$GITHUB_SHA
          versionName=0.12.1
          versionCode=58
          databaseSchema=3
          catalogBuiltinVersion=2
          catalogRemoteVersion=3
          localRecords=32
          films=7
          filmDevelopers=12
          tanks=6
          smart_search=PASS
          ux=PASS
          catalog=PASS
          offline=PASS
          sqlite_upgrade=PASS
          r2_r9_regression=PASS
          timer_regression=PASS
          build=SUCCESS
          zipalign=SUCCESS
          signature=SUCCESS
          certificate_continuity=PASS
          certificate_SHA256=$CERT_FP
          artifact=DarkroomTimer-DIY-v0.12.1
          artifact_id=$ARTIFACT_ID
          apk_SHA256=$APK_SHA
          EOF
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0121/latest_run.txt
          git commit -m "Record v0.12.1 successful build $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:feature-v0121-assistant-ux-smart-catalog
