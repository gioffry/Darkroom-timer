name: Build Diario Percorsi APK

on:
  push:
    branches: [ diario-percorsi ]
    paths:
      - 'diario-percorsi/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Diario Percorsi branch
        uses: actions/checkout@v4
        with:
          ref: diario-percorsi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create runtime config
        working-directory: diario-percorsi
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: python3 scripts/write_config.py

      - name: Build Diario Percorsi debug APK
        working-directory: diario-percorsi
        run: gradle assembleDebug

      - name: Upload Diario Percorsi APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diario-Percorsi-APK
          path: diario-percorsi/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish stable APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diario-percorsi/downloads
          cp diario-percorsi/app/build/outputs/apk/debug/app-debug.apk diario-percorsi/downloads/Diario-Percorsi.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diario-percorsi/downloads/Diario-Percorsi.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'chore(diario-percorsi): publish APK [skip ci]'
          git push origin HEAD:diario-percorsi
