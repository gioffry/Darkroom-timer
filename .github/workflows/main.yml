name: Build Darkroom Timer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara sorgenti base e applica aggiornamenti
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work

          if [ -d base/v0.6.0/project ] && [ -f base/v0.6.0/build_darkroom.py ]; then
            echo "Uso base consolidata v0.6.0"
            cp -a base/v0.6.0/project work/project
            cp base/v0.6.0/build_darkroom.py work/build_darkroom.py
            echo "BOOTSTRAP_V060=0" >> "$GITHUB_ENV"
          else
            echo "Base v0.6.0 non ancora consolidata: la genero dalla catena storica"
            mkdir -p work/source
            unzip -o DarkroomTimer-v0.5.8-BUILD.zip -d work/package
            unzip -o work/package/DarkroomTimer-source-v0.5.8-WIP.zip -d work/source
            mv work/source/v058src work/project
            cp work/package/build_darkroom_v058.py work/build_darkroom.py

            if [ -d patches ]; then
              while IFS= read -r patch_file; do
                echo "Applico $patch_file"
                patch -d work -p1 < "$patch_file"
              done < <(find patches -maxdepth 1 -type f -name '*.patch' | sort)
            fi
            echo "BOOTSTRAP_V060=1" >> "$GITHUB_ENV"
          fi

          if [ -d patches/active ]; then
            while IFS= read -r patch_file; do
              echo "Applico patch attiva $patch_file"
              patch -d work -p1 < "$patch_file"
            done < <(find patches/active -maxdepth 1 -type f -name '*.patch' | sort)
          fi

      - name: Leggi versione risultante
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          m = re.search(r'android:versionName="([^"]+)"', text)
          if not m:
              raise SystemExit('versionName non trovato')
          print(m.group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Versione da compilare: $VERSION_NAME"

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepara firma stabile
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Compila APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 work/build_darkroom.py \
            work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" \
            --storepass "$KEYSTORE_PASSWORD" \
            --keypass "$KEY_PASSWORD"

      - name: Consolida base sorgente v0.6.0
        if: env.BOOTSTRAP_V060 == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base/v0.6.0
          rm -rf base/v0.6.0/project
          cp -a work/project base/v0.6.0/project
          cp work/build_darkroom.py base/v0.6.0/build_darkroom.py
          find base/v0.6.0 -type f -name '*.orig' -delete

          mkdir -p patches/archive-v05 patches/active
          shopt -s nullglob
          for patch_file in patches/*.patch; do
            git mv "$patch_file" patches/archive-v05/
          done
          cat > patches/active/README.md <<'EOF'
          # Patch attive

          Le nuove patch successive alla base consolidata v0.6.0 vanno inserite qui e vengono applicate in ordine alfabetico dal workflow.
          EOF

          git config user.name "Darkroom Timer Build"
          git config user.email "actions@users.noreply.github.com"
          git add base/v0.6.0 patches
          git commit -m "Consolidate source base v0.6.0"
          git push origin HEAD:main

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk
