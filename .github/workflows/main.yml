name: Build Darkroom Timer APK

on:
  push:
    branches: [ main, feature-v071-fstop, feature-v072-polish ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara base consolidata e patch attive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          test -d base/v0.6.0/project
          test -f base/v0.6.0/build_darkroom.py
          echo "Uso base consolidata v0.6.0"
          cp -a base/v0.6.0/project work/project
          cp base/v0.6.0/build_darkroom.py work/build_darkroom.py

          if [ -d patches/active ]; then
            while IFS= read -r patch_file; do
              echo "Applico patch attiva $patch_file"
              patch -d work -p1 < "$patch_file"
            done < <(find patches/active -maxdepth 1 -type f -name '*.patch' | sort)
          fi

      - name: Applica temporizzazione F-STOP coerente v0.7.1
        if: github.ref == 'refs/heads/feature-v071-fstop' || github.ref == 'refs/heads/feature-v072-polish'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/v071/apply_v071_fstop.py')
          s = p.read_text(encoding='utf-8')
          old = "new, n = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "new, n = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)"
          if old not in s:
              raise SystemExit('helper regex_replace non trovato')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 experiments/v071/apply_v071_fstop.py work

      - name: Applica rifiniture v0.7.2
        if: github.ref == 'refs/heads/feature-v072-polish'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/v072/apply_v072_polish.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('# Stato SONOFF: PRONTO non è ammesso durante la riconnessione.')
          end = s.index('# Badge F-STOP helper, red-only in camera oscura.')
          replacement = '''# Stato SONOFF: gestito in modo robusto dal workflow dopo le altre rifiniture.\nprint('OK stato riconnessione rinviato al fix robusto')\n\n'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY

          python3 experiments/v072/apply_v072_polish.py work

          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('work/project/app/src/main/java/it/darkroom/timer/MainActivity.java')
          s = main.read_text(encoding='utf-8')

          old_ready = '''    private final Runnable readyResetRunnable = () -> {\n        if (!armed && mode != MODE_LOG && stateCard != null) {\n            setStatusPresentation("PRONTO", "Scegli il tempo e premi ARMA",\n                    device != null && device.isValid() ? GREEN : MUTED);\n        }\n    };'''
          new_ready = '''    private final Runnable readyResetRunnable = () -> {\n        if (!armed && mode != MODE_LOG && stateCard != null) {\n            if (device != null && device.isValid()) {\n                setStatusPresentation("PRONTO", "Scegli il tempo e premi ARMA", GREEN);\n            } else {\n                setStatusPresentation("ATTESA SONOFF",\n                        "RICONNESSIONE AUTOMATICA — attendo conferma dal SONOFF",\n                        darkroomMode ? RED : AMBER);\n            }\n        }\n    };'''
          if old_ready not in s:
              raise SystemExit('readyResetRunnable non trovato')
          s = s.replace(old_ready, new_ready, 1)

          old_normal = '''            } else {\n                if (detail.isEmpty() && device != null && device.isValid()) detail = "Scegli il tempo e premi ARMA";\n                accent = device != null && device.isValid() ? GREEN : MUTED;\n            }'''
          new_normal = '''            } else {\n                if (device != null && device.isValid()) {\n                    title = "PRONTO";\n                    if (detail.isEmpty()) detail = "Scegli il tempo e premi ARMA";\n                    accent = GREEN;\n                } else {\n                    title = "ATTESA SONOFF";\n                    detail = "RICONNESSIONE AUTOMATICA — attendo conferma dal SONOFF";\n                    accent = darkroomMode ? RED : AMBER;\n                }\n            }'''
          if old_normal not in s:
              raise SystemExit('ramo STATE_NORMAL non trovato')
          s = s.replace(old_normal, new_normal, 1)
          main.write_text(s, encoding='utf-8')

          # L'icona definitiva viene inserita dopo il download dell'APK usando
          # l'immagine originale fornita dall'utente; qui lasciamo il launcher
          # corrente solo per produrre un APK compilato e firmato di base.
          build = Path('work/build_darkroom.py').read_text(encoding='utf-8')
          m = re.search(r'from v064_icon import ([A-Za-z_][A-Za-z0-9_]*)', build)
          if not m:
              raise SystemExit('import v064_icon non trovato')
          func = m.group(1)
          Path('work/v064_icon.py').write_text(
              'from pathlib import Path\n\n'
              f'def {func}(project):\n'
              '    print("[Darkroom v0.7.2] Icona provvisoria del build; sostituzione finale post-build", flush=True)\n',
              encoding='utf-8')

          checks = [
              'ATTESA SONOFF',
              'RICONNESSIONE AUTOMATICA — attendo conferma dal SONOFF',
              'F-STOP  ·  ¼ stop',
              '½ stop: indicare 0,5',
              'private TextView fStopBadge'
          ]
          final = main.read_text(encoding='utf-8')
          for needle in checks:
              if needle not in final:
                  raise SystemExit('verifica v0.7.2 fallita: ' + needle)
          print('v0.7.2: fix SONOFF + F-STOP + editor verificati')
          PY

      - name: Leggi versione risultante
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          m = re.search(r'android:versionName="([^"]+)"', text)
          if not m:
              raise SystemExit('versionName non trovato')
          print(m.group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Versione da compilare: $VERSION_NAME"

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepara firma stabile
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Compila APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 work/build_darkroom.py \
            work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" \
            --storepass "$KEYSTORE_PASSWORD" \
            --keypass "$KEY_PASSWORD"

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk

      - name: Esporta strumenti firma APK
        if: github.ref == 'refs/heads/feature-v072-polish'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-sign-tools
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" android-sign-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/zipalign" android-sign-tools/
          chmod +x android-sign-tools/zipalign

      - name: Salva strumenti firma APK
        if: github.ref == 'refs/heads/feature-v072-polish'
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools-34
          path: android-sign-tools/
