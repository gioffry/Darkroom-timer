name: Build Darkroom Timer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Pubblica stato build avviata
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"darkroom-apk-build\",\"description\":\"Build APK in corso\",\"target_url\":\"$RUN_URL\"}" >/dev/null

      - name: Prepara base consolidata e patch attive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          test -d base/v0.6.0/project
          test -f base/v0.6.0/build_darkroom.py
          echo "Uso base consolidata v0.6.0"
          cp -a base/v0.6.0/project work/project
          cp base/v0.6.0/build_darkroom.py work/build_darkroom.py

          if [ -d patches/active ]; then
            while IFS= read -r patch_file; do
              echo "Applico patch attiva $patch_file"
              patch -d work -p1 < "$patch_file"
            done < <(find patches/active -maxdepth 1 -type f -name '*.patch' | sort)
          fi

      - name: Leggi versione risultante
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          m = re.search(r'android:versionName="([^"]+)"', text)
          if not m:
              raise SystemExit('versionName non trovato')
          print(m.group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Versione da compilare: $VERSION_NAME"

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepara firma stabile
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Compila APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 work/build_darkroom.py \
            work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" \
            --storepass "$KEYSTORE_PASSWORD" \
            --keypass "$KEY_PASSWORD"

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk

      - name: Pubblica esito build
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Build APK completata"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            STATE="error"
            DESCRIPTION="Build APK annullata"
          else
            STATE="failure"
            DESCRIPTION="Build APK fallita"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"darkroom-apk-build\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$RUN_URL\"}" >/dev/null
