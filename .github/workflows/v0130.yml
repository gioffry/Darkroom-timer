name: Build Darkroom Timer v0.13.0

on:
  push:
    branches: [ feature-v0130-timer-only-reset ]
    paths-ignore:
      - 'experiments/v0130/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darkroom-v0130-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Timer-only branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0130-timer-only-reset
          fetch-depth: 0

      - name: Prove genealogy from successful v0.12.3
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=54796e9f41ca28cd343f22ae19e263eb9bdcbda1
          git fetch origin feature-v0123-assistant-live-web-repair
          BASE_HEAD=$(git rev-parse origin/feature-v0123-assistant-live-web-repair)
          test "$BASE_HEAD" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          MERGE_BASE=$(git merge-base "$BASE_HEAD" HEAD)
          test "$MERGE_BASE" = "$BASE_HEAD"
          echo "BASE_HEAD=$BASE_HEAD" >> "$GITHUB_ENV"
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

      - name: Reconstruct exact successful v0.12.3 functional image
        shell: bash
        run: |
          set -euo pipefail
          SNAP=base/v0.12.0-materialized
          rm -rf work && mkdir -p work
          cp -a "$SNAP/project" work/project
          cp "$SNAP/build_darkroom.py" work/build_darkroom.py
          cp "$SNAP/v064_icon.py" work/v064_icon.py
          python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work
          python3 experiments/v0122/apply_v0122_real_device_repair.py work
          python3 experiments/v0123/apply_v0123_live_web_repair.py work
          python3 experiments/v0123/apply_v0123_no_manual_cleanup.py work
          grep -q 'android:versionName="0.12.3"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="60"' work/project/app/src/main/AndroidManifest.xml

      - name: Fingerprint protected Timer core before cleanup
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          find "$ROOT" -maxdepth 1 -type f -name '*.java' \
            ! -name 'MainActivity.java' ! -name 'LogEntry.java' ! -name 'LogStore.java' \
            -print0 | sort -z | xargs -0 sha256sum > timer-core-before.sha256
          test -s timer-core-before.sha256

      - name: Remove Assistant and restore direct Timer launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0130/apply_v0130_timer_only_reset.py
          python3 experiments/v0130/apply_v0130_timer_only_reset.py work

      - name: Prove Timer core is byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          find "$ROOT" -maxdepth 1 -type f -name '*.java' \
            ! -name 'MainActivity.java' ! -name 'LogEntry.java' ! -name 'LogStore.java' \
            -print0 | sort -z | xargs -0 sha256sum > timer-core-after.sha256
          cmp timer-core-before.sha256 timer-core-after.sha256
          test ! -d "$ROOT/assistant"
          test ! -d "$ROOT/home"
          ! grep -RniE 'assistant|smart search|SVILUPPO & CHIMICA|CHIMICA SESSIONE|paperChemistry' work/project/app/src/main --include='*.java' --include='*.xml'
          grep -q 'SPLIT GRADE' "$ROOT/MainActivity.java"
          grep -q 'PROVINO' "$ROOT/MainActivity.java"
          grep -q 'ARMA' "$ROOT/MainActivity.java"
          grep -q 'F-STOP' "$ROOT/MainActivity.java"
          grep -q 'android:name=".MainActivity"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' work/project/app/src/main/AndroidManifest.xml
          ! grep -q 'home.HomeActivity' work/project/app/src/main/AndroidManifest.xml

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK on GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify final Timer-only version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:versionName="0.13.0"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="61"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'package="it.darkroom.timer"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'private static final String APP_VERSION = "0.13.0";' work/project/app/src/main/java/it/darkroom/timer/MainActivity.java
          echo "name=0.13.0" >> "$GITHUB_OUTPUT"
          cat > validation-report.txt <<'EOF'
          release=Timer-only reset
          Assistant_module=REMOVED
          Assistant_references_in_Timer=REMOVED
          SmartSearch=REMOVED
          Chemistry_session_in_Timer=REMOVED
          Home_two_module_selector=REMOVED
          Direct_Timer_launcher=PASS
          Timer_core_byte_identity=PASS
          SplitGrade=PASS
          Provini=PASS
          FStop=PASS
          Sonoff=PASS
          PrintLog=PASS
          package=it.darkroom.timer
          versionName=0.13.0
          versionCode=61
          EOF

      - name: Prepare stable signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build sign zipalign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="DarkroomTimer-DIY-v0.13.0.apk"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          python3 work/build_darkroom.py work/project --output "$APK" --keystore "$RUNNER_TEMP/darkroom-signing.p12" --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD" >/tmp/darkroom-build.log 2>&1
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK" > zipalign.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > certificate.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='it.darkroom.timer' versionCode='61' versionName='0.13.0'" apk-badging.txt
          CERT_FP=$(grep -m1 'certificate SHA-256 digest:' certificate.txt | sed 's/.*: *//')
          test "$CERT_FP" = "fbead305657584b50a9d8892aa19bd9844b412d77db316e7daa5593c94e2a02f"
          sha256sum "$APK" > apk.sha256
          APK_SHA=$(cut -d' ' -f1 apk.sha256)
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "CERT_FP=$CERT_FP" >> "$GITHUB_ENV"
          {
            echo "build=SUCCESS"
            echo "zipalign=SUCCESS"
            echo "signature=SUCCESS"
            echo "certificate_continuity=PASS"
            echo "certificate_SHA256=$CERT_FP"
            echo "apk_SHA256=$APK_SHA"
            echo "artifact=DarkroomTimer-DIY-v0.13.0"
          } >> validation-report.txt

      - name: Upload Timer-only APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v0.13.0
          path: |
            DarkroomTimer-DIY-v0.13.0.apk
            apk.sha256
            certificate.txt
            zipalign.txt
            apk-badging.txt
            timer-core-before.sha256
            timer-core-after.sha256
            validation-report.txt

      - name: Record successful build metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p experiments/v0130
          cat > experiments/v0130/latest_run.txt <<EOF
          run_id=$GITHUB_RUN_ID
          base_branch=feature-v0123-assistant-live-web-repair
          base_head=$BASE_HEAD
          new_branch=feature-v0130-timer-only-reset
          merge_base=$MERGE_BASE
          functional_commit=$GITHUB_SHA
          versionName=0.13.0
          versionCode=61
          assistant_module=REMOVED
          assistant_timer_references=REMOVED
          direct_timer_launcher=PASS
          timer_core_byte_identity=PASS
          build=SUCCESS
          zipalign=SUCCESS
          signature=SUCCESS
          certificate_continuity=PASS
          certificate_SHA256=$CERT_FP
          artifact=DarkroomTimer-DIY-v0.13.0
          artifact_id=$ARTIFACT_ID
          apk_SHA256=$APK_SHA
          EOF
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0130/latest_run.txt
          git commit -m "Record v0.13.0 Timer-only build $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:feature-v0130-timer-only-reset
