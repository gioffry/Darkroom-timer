name: Monitor Darkroom Timer v0.12.0 run
# retry-marker: splitgrade-timingmath-dependency

on:
  push:
    branches: [ feature-v0120-darkroom-assistant-r7-r8-r9 ]
    paths:
      - '.github/workflows/v0120-monitor.yml'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0120-darkroom-assistant-r7-r8-r9
          fetch-depth: 0
      - name: Find exact v0120 run and record its conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v0120.yml/runs?branch=feature-v0120-darkroom-assistant-r7-r8-r9&event=push&per_page=20"
          RUN_ID=""
          STATUS=""
          CONCLUSION=""
          URL=""
          for i in $(seq 1 50); do
            JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API")
            RUN_ID=$(printf '%s' "$JSON" | jq -r --arg sha "$HEAD_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              STATUS=$(printf '%s' "$JSON" | jq -r --argjson id "$RUN_ID" '.workflow_runs[] | select(.id==$id) | .status')
              CONCLUSION=$(printf '%s' "$JSON" | jq -r --argjson id "$RUN_ID" '.workflow_runs[] | select(.id==$id) | .conclusion')
              URL=$(printf '%s' "$JSON" | jq -r --argjson id "$RUN_ID" '.workflow_runs[] | select(.id==$id) | .html_url')
              echo "v0120 run $RUN_ID status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then break; fi
            fi
            sleep 10
          done
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          test "$STATUS" = "completed"
          sleep 5
          git pull --ff-only origin feature-v0120-darkroom-assistant-r7-r8-r9
          if [ "$CONCLUSION" != "success" ] || [ ! -f experiments/v0120/latest_run.txt ]; then
            mkdir -p experiments/v0120
            cat > experiments/v0120/latest_run.txt <<EOF
          run_id=$RUN_ID
          functional_commit=$HEAD_SHA
          build=$([ "$CONCLUSION" = "success" ] && echo SUCCESS || echo FAILURE)
          conclusion=$CONCLUSION
          html_url=$URL
          EOF
            git config user.name "Darkroom Timer Builder"
            git config user.email "actions@users.noreply.github.com"
            git add experiments/v0120/latest_run.txt
            git commit -m "Record v0.12.0 monitored run $RUN_ID [skip ci]"
            git push origin HEAD:feature-v0120-darkroom-assistant-r7-r8-r9
          fi
