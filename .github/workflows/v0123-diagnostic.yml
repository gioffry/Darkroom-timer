name: Diagnose Darkroom Timer v0.12.3

on:
  push:
    branches: [ feature-v0123-assistant-live-web-repair ]
    paths-ignore:
      - 'experiments/v0123/diagnostic.txt'
      - 'experiments/v0123/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0123-assistant-live-web-repair
          fetch-depth: 0
      - name: Run staged diagnostics and always record result
        shell: bash
        run: |
          set +e
          FAIL=""
          rm -rf work && mkdir -p work
          cp -a base/v0.12.0-materialized/project work/project || FAIL="copy_base"
          cp base/v0.12.0-materialized/build_darkroom.py work/build_darkroom.py || FAIL="copy_builder"
          cp base/v0.12.0-materialized/v064_icon.py work/v064_icon.py || FAIL="copy_icon"
          if [ -z "$FAIL" ]; then python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work > diag-v0121.txt 2>&1 || FAIL="apply_v0121"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0122/apply_v0122_real_device_repair.py work > diag-v0122.txt 2>&1 || FAIL="apply_v0122"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0123/apply_v0123_live_web_repair.py work > diag-v0123.txt 2>&1 || FAIL="apply_v0123"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0123/apply_v0123_no_manual_cleanup.py work > diag-cleanup.txt 2>&1 || FAIL="cleanup"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0123/test_web_parser.py > diag-parser.txt 2>&1 || FAIL="web_parser"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0123/verify_v0123_release.py work > diag-verify.txt 2>&1 || FAIL="verify"; fi
          mkdir -p experiments/v0123
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            if [ -z "$FAIL" ]; then echo "status=PASS"; else echo "status=FAIL"; echo "failed_stage=$FAIL"; fi
            for f in diag-v0121.txt diag-v0122.txt diag-v0123.txt diag-cleanup.txt diag-parser.txt diag-verify.txt; do
              if [ -f "$f" ]; then echo "--- $f ---"; tail -80 "$f"; fi
            done
          } > experiments/v0123/diagnostic.txt
          git config user.name "Darkroom Timer Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0123/diagnostic.txt
          git commit -m "Record v0.12.3 diagnostic $GITHUB_RUN_ID [skip ci]" || true
          git push origin HEAD:feature-v0123-assistant-live-web-repair || true
          exit 0
