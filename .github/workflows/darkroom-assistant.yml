name: Build Darkroom Assistant APK

on:
  push:
    branches:
      - feature-darkroom-assistant-v030-offline-mdc
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Genera database Digitaltruth completo
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/build_mdc_sqlite_asset.py
          python3 - <<'PY'
          import sqlite3, pathlib
          p=pathlib.Path('assistant/src/main/assets/mdc_full.sqlite')
          assert p.exists() and p.stat().st_size > 250000
          con=sqlite3.connect(p)
          rows=con.execute('select count(*) from times').fetchone()[0]
          films=con.execute('select count(*) from films').fetchone()[0]
          devs=con.execute('select count(*) from developers').fetchone()[0]
          qc=con.execute('pragma quick_check').fetchone()[0]
          con.close()
          print(f'ASSET DB VERIFIED: films={films} developers={devs} rows={rows} quick_check={qc}')
          assert rows >= 3000 and films >= 250 and devs >= 180 and qc == 'ok'
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Applica fix risultati ricerca visibili
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v018_visible_results.py

      - name: Applica fix ricerca v0.1.9
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v019_search_enrichment.py

      - name: Applica integrazione fonti v0.2.0
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v020_source_brain.py

      - name: Applica fallback indice live v0.2.1
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v021_index_fallback.py

      - name: Applica filtro entita e scroll v0.2.2
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v022_strict_entities.py

      - name: Applica database offline v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v030_offline_mdc.py

      - name: Applica database incluso v0.3.1
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v031_bundled_db.py
          grep -q 'mdc_offline_v031.sqlite' assistant/src/main/java/it/darkroom/assistant/MdcOfflineStore.java
          grep -q 'app.getAssets().open("mdc_full.sqlite")' assistant/src/main/java/it/darkroom/assistant/MdcOfflineStore.java
          grep -q 'MdcOfflineStore.searchDevelopers' assistant/src/main/java/it/darkroom/assistant/OnlineCatalogSearch.java
          grep -q 'MdcOfflineStore.lookup' assistant/src/main/java/it/darkroom/assistant/DevTimeEngine.java
          test -f assistant/src/main/assets/mdc_full.sqlite

      - name: Prepara firma stabile
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build Assistant firmato
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :assistant:assembleRelease --stacktrace
          cp assistant/build/outputs/apk/release/assistant-release.apk DarkroomAssistant-v0.3.1.apk

      - name: Verifica APK e database incluso
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs DarkroomAssistant-v0.3.1.apk
          "$AAPT" dump badging DarkroomAssistant-v0.3.1.apk | head -20
          unzip -l DarkroomAssistant-v0.3.1.apk | grep -q 'assets/mdc_full.sqlite'
          echo 'Bundled Digitaltruth SQLite found inside APK'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomAssistant-v0.3.1
          path: DarkroomAssistant-v0.3.1.apk
