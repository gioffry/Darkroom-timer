name: Build Darkroom Assistant APK

on:
  push:
    branches:
      - feature-darkroom-assistant-v030-offline-mdc
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Genera database Digitaltruth canonico
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/build_mdc_sqlite_asset_v032.py
          python3 - <<'PY'
          import sqlite3, pathlib
          p=pathlib.Path('assistant/src/main/assets/mdc_full.sqlite')
          assert p.exists() and p.stat().st_size > 250000
          con=sqlite3.connect(p)
          rows=con.execute('select count(*) from times').fetchone()[0]
          films=con.execute('select count(*) from films').fetchone()[0]
          devs=con.execute('select count(*) from developers').fetchone()[0]
          dbv=con.execute('pragma user_version').fetchone()[0]
          rod=con.execute("select count(*) from developers where lower(name)='rodinal'").fetchone()[0]
          ferr=con.execute("select count(*) from films where lower(name)='ferrania p30'").fetchone()[0]
          noise=con.execute("select count(*) from films where lower(name) like '%prewash%' or lower(name) like '%from 2025%'").fetchone()[0]
          qc=con.execute('pragma quick_check').fetchone()[0]
          print(f'CANONICAL DB VERIFIED: films={films} developers={devs} rows={rows} user_version={dbv} rodinal={rod} ferrania={ferr} noise={noise} quick_check={qc}')
          assert 250 <= films <= 450
          assert 180 <= devs <= 234
          assert rows >= 3000 and dbv == 2 and rod == 1 and ferr == 1 and noise == 0 and qc == 'ok'
          con.close()
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Applica base UI e sorgenti precedenti
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v018_visible_results.py
          python3 assistant/patch_v019_search_enrichment.py
          python3 assistant/patch_v020_source_brain.py
          python3 assistant/patch_v021_index_fallback.py
          python3 assistant/patch_v022_strict_entities.py
          python3 assistant/patch_v030_offline_mdc.py
          python3 assistant/patch_v031_bundled_db.py
          python3 assistant/patch_v032_pure_offline.py
          python3 assistant/patch_v033_startup_safe.py
          python3 assistant/patch_v034_db_schema_match.py

      - name: Verifica contratto offline v0.3.4
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mdc_offline_v034.sqlite' assistant/src/main/java/it/darkroom/assistant/MdcOfflineStore.java
          grep -q 'private static final int DB_VERSION = 2;' assistant/src/main/java/it/darkroom/assistant/MdcOfflineStore.java
          grep -q 'return MdcOfflineStore.searchDevelopers(query, 80)' assistant/src/main/java/it/darkroom/assistant/OnlineCatalogSearch.java
          grep -q 'Nessuna combinazione esatta nel database offline Digitaltruth' assistant/src/main/java/it/darkroom/assistant/DevTimeEngine.java
          ! grep -q 'uses-permission android:name="android.permission.INTERNET"' assistant/src/main/AndroidManifest.xml
          test -f assistant/src/main/assets/mdc_full.sqlite
          echo 'SQLite asset user_version=2 e helper DB_VERSION=2'

      - name: Prepara firma stabile
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build Assistant firmato
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :assistant:assembleRelease --stacktrace
          cp assistant/build/outputs/apk/release/assistant-release.apk DarkroomAssistant-v0.3.4.apk

      - name: Verifica APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs DarkroomAssistant-v0.3.4.apk
          "$AAPT" dump badging DarkroomAssistant-v0.3.4.apk | head -20
          unzip -l DarkroomAssistant-v0.3.4.apk | grep -q 'assets/mdc_full.sqlite'
          if "$AAPT" dump permissions DarkroomAssistant-v0.3.4.apk | grep -q 'android.permission.INTERNET'; then
            echo 'ERRORE: APK chiede ancora INTERNET' >&2
            exit 1
          fi
          echo 'APK v0.3.4 verificato: DB incluso, schema version allineato, nessun Internet'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomAssistant-v0.3.4
          path: DarkroomAssistant-v0.3.4.apk
