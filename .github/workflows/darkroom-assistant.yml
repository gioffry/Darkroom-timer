name: Build Darkroom Assistant APK

on:
  push:
    branches:
      - feature-darkroom-assistant-v001-dark-mockup
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build Assistant
        shell: bash
        run: |
          set -euo pipefail
          gradle :assistant:assembleDebug --stacktrace
          cp assistant/build/outputs/apk/debug/assistant-debug.apk DarkroomAssistant-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomAssistant-v0.1.0
          path: DarkroomAssistant-v0.1.0.apk
