name: Materialize exact v0.11.0 source base

on:
  push:
    branches: [ feature-v0120-darkroom-assistant-r7-r8-r9 ]
    paths:
      - '.github/workflows/materialize-v0110-base.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new release branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0120-darkroom-assistant-r7-r8-r9
          fetch-depth: 0

      - name: Prove direct genealogy from exact v0.11.0 HEAD
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=2323260110c92801095847198bcf4e5aaf712889
          git fetch origin feature-v0110-darkroom-assistant-r5-r6
          BASE=$(git rev-parse origin/feature-v0110-darkroom-assistant-r5-r6)
          test "$BASE" = "$EXPECTED"
          git merge-base --is-ancestor "$BASE" HEAD
          MERGE=$(git merge-base "$BASE" HEAD)
          test "$MERGE" = "$BASE"
          FIRST=$(git rev-list --reverse "$BASE"..HEAD | head -1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          echo "Exact v0.11.0 HEAD: $BASE"
          echo "Merge-base: $MERGE"

      - name: Materialize inherited v0.11.0 graph once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work
          cp -a base/v0.7.7/project work/project
          cp base/v0.7.7/build_darkroom.py work/build_darkroom.py
          cp base/v0.7.7/v064_icon.py work/v064_icon.py
          python3 experiments/v080/prepare_v080_transform.py
          python3 experiments/v080/apply_v080_print_sequence.py work
          python3 experiments/v080/apply_v080_fixups.py work
          python3 experiments/v081/prepare_v081_transform.py
          python3 experiments/v081/apply_v081_print_plan_polish.py work
          python3 experiments/v090/prepare_v090_transform.py
          python3 experiments/v090/apply_v090_split_grade.py work
          python3 experiments/v090/apply_v090_fixups.py work
          python3 experiments/v091/prepare_v091_transform.py
          python3 experiments/v091/apply_v091_timing_voice_polish.py work
          python3 experiments/v0100/prepare_v0100_transform.py
          python3 experiments/v0100/apply_v0100_pro_recipe.py work
          python3 experiments/v0101/prepare_v0101_transform.py
          python3 experiments/v0101/apply_v0101_stability_ux.py work
          python3 experiments/v0102/prepare_v0102_transform.py
          python3 experiments/v0102/apply_v0102_test_fixes.py work
          python3 experiments/v0103/prepare_v0103_transform.py
          python3 experiments/v0103/apply_v0103_split_short_exposure.py work
          python3 experiments/v0104/prepare_v0104_transform.py
          python3 experiments/v0104/apply_v0104_dodge_burn_voice.py work
          python3 experiments/v0105/apply_v0105_premature_off_failsafe.py work
          python3 experiments/v0106/apply_v0106_darkroom_assistant_r1.py work
          python3 experiments/v0107/apply_v0107_darkroom_assistant_r2.py work
          python3 experiments/v0108/apply_v0108_darkroom_assistant_r3.py work
          python3 experiments/v0109/apply_v0109_darkroom_assistant_r4.py work
          python3 experiments/v01010/prepare_v01010_transform.py
          python3 experiments/v01010/apply_v01010_timer_splitgrade_provini.py work
          python3 experiments/v0110/apply_v0110_darkroom_assistant_r5_r6.py work

      - name: Verify materialized source is exactly the protected v0.11.0 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work/project');java=root/'app/src/main/java/it/darkroom/timer'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text()
          gradle=(root/'app/build.gradle').read_text()
          main=(java/'MainActivity.java').read_text()
          split=(java/'SplitGradePlan.java').read_text()
          schema=(java/'assistant/data/AssistantDataSchema.java').read_text()
          assert 'android:versionName="0.11.0"' in manifest and 'android:versionCode="56"' in manifest
          assert "versionName '0.11.0'" in gradle and 'versionCode 56' in gradle
          assert 'private static final String APP_VERSION = "0.11.0";' in main
          for n in ['NUOVO PROVINO DA QUESTA STAMPA','testFromPrint','showPrintCorrectionEditor','maybeShowTestResultChooser','DODGE','BURN']: assert n in main,n
          for n in ['public int softYellow = 60;','public int hardMagenta = 180;','softYellow + "Y / 0M','0Y / " + hardMagenta + "M']: assert n in split,n
          assert 'public static final int VERSION = 2;' in schema
          assert 'DROP TABLE' not in schema
          print('Materialized source verified: v0.11.0 / 56 / Assistant schema 2 / R1-R6 / Timer baseline OK')
          PY
          python3 experiments/v0110/test_migration_v1_to_v2.py

      - name: Commit immutable materialized v0.11.0 snapshot to the new branch
        shell: bash
        run: |
          set -euo pipefail
          SNAP=base/v0.11.0-materialized
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          cp -a work/project "$SNAP/project"
          cp work/build_darkroom.py "$SNAP/build_darkroom.py"
          cp work/v064_icon.py "$SNAP/v064_icon.py"
          cat > "$SNAP/BASE_PROVENANCE.txt" <<'EOF'
          versionName=0.11.0
          versionCode=56
          base_branch=feature-v0110-darkroom-assistant-r5-r6
          base_head=2323260110c92801095847198bcf4e5aaf712889
          assistant_schema=2
          purpose=immutable source snapshot for v0.12.0 derivation
          EOF
          find "$SNAP" -type f -print0 | sort -z | xargs -0 sha256sum > "$SNAP/SHA256SUMS.txt"
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "$SNAP"
          git commit -m "Materialize protected v0.11.0 source snapshot [skip ci]"
          git push origin HEAD:feature-v0120-darkroom-assistant-r7-r8-r9
