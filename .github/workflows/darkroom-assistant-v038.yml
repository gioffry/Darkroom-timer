name: Build Darkroom Assistant v0.3.8

on:
  push:
    branches:
      - feature-darkroom-assistant-v038-edit-persistence
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-assistant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Genera database Digitaltruth canonico
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/build_mdc_sqlite_asset_v032.py
          python3 - <<'PY'
          import sqlite3, pathlib
          p=pathlib.Path('assistant/src/main/assets/mdc_full.sqlite')
          assert p.exists() and p.stat().st_size > 250000
          con=sqlite3.connect(p)
          rows=con.execute('select count(*) from times').fetchone()[0]
          films=con.execute('select count(*) from films').fetchone()[0]
          devs=con.execute('select count(*) from developers').fetchone()[0]
          qc=con.execute('pragma quick_check').fetchone()[0]
          print(f'DB VERIFIED: films={films} developers={devs} rows={rows} quick_check={qc}')
          assert rows >= 3000 and films >= 250 and devs >= 180 and qc == 'ok'
          con.close()
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Applica patch storiche offline
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v018_visible_results.py
          python3 assistant/patch_v019_search_enrichment.py
          python3 assistant/patch_v020_source_brain.py
          python3 assistant/patch_v021_index_fallback.py
          python3 assistant/patch_v022_strict_entities.py
          python3 assistant/patch_v030_offline_mdc.py
          python3 assistant/patch_v031_bundled_db.py
          python3 assistant/patch_v032_pure_offline.py
          python3 assistant/patch_v033_startup_safe.py
          python3 assistant/patch_v034_db_schema_match.py

      - name: Applica v0.3.5 formato + stop fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assistant/patch_v035_format_stop_fix.py')
          s=p.read_text()
          start=s.index('# Nel flusso pellicola aggiungi FORMATO')
          end=s.index('# Listener formato:', start)
          block=r'''# Nel flusso pellicola aggiungi FORMATO prima del campo ISO.
          needle = '        isoField = edit("", InputType.TYPE_CLASS_NUMBER);'
          repl = ''' + "'''" + '''        formatSpinner = spinner(new String[]{"Seleziona prima la pellicola"});
          page.addView(fieldBlock("FORMATO", formatSpinner));

          isoField = edit("", InputType.TYPE_CLASS_NUMBER);''' + "'''" + r'''
          if needle not in s:
              raise SystemExit('film ISO insertion marker missing')
          s = s.replace(needle, repl, 1)

          '''
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          python3 assistant/patch_v035_format_stop_fix.py

      - name: Applica v0.3.6 risultati visibili
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v036_inline_results.py

      - name: Applica v0.3.7 tempo ricerca capacita
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v037_time_search_capacity.py

      - name: Applica v0.3.8 salvataggio modifiche e testi semplici
        shell: bash
        run: |
          set -euo pipefail
          python3 assistant/patch_v038_edit_persistence_simplify.py

      - name: Verifica contratto v0.3.8
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.3.8'" assistant/build.gradle
          grep -q 'versionCode 22' assistant/build.gradle
          ! grep -q 'uses-permission android:name="android.permission.INTERNET"' assistant/src/main/AndroidManifest.xml
          test -f assistant/src/main/assets/mdc_full.sqlite
          python3 - <<'PY'
          from pathlib import Path
          a=Path('assistant/src/main/java/it/darkroom/assistant/AssistantActivityV2.java').read_text()
          start=a.index('    private Product findProduct(String name) {')
          end=a.index('    private FilmStock findFilm', start)
          m=a[start:end]
          assert m.index('loadSavedProduct(wanted)') < m.index('canonicalDeveloperName(wanted)')
          assert 'if (saved != null) return saved;' in m
          assert 'if (loadSavedProduct(name) == null) saveProductMetadata(curated);' in a
          assert 'scheda Compard' not in a
          assert 'Riutilizzabile · capacità ' in a
          assert 'residue ' in a
          assert 'replaceInventoryProduct(oldName, edited, newOpened);' in a
          assert 'saveProductMetadata(p);' in a
          print('v0.3.8 contract verified: user edits win over catalog and persist')
          PY

      - name: Prepara firma stabile
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build Assistant firmato
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :assistant:assembleRelease --stacktrace
          cp assistant/build/outputs/apk/release/assistant-release.apk DarkroomAssistant-v0.3.8.apk

      - name: Verifica APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs DarkroomAssistant-v0.3.8.apk
          "$AAPT" dump badging DarkroomAssistant-v0.3.8.apk | head -20
          unzip -l DarkroomAssistant-v0.3.8.apk | grep -q 'assets/mdc_full.sqlite'
          if "$AAPT" dump permissions DarkroomAssistant-v0.3.8.apk | grep -q 'android.permission.INTERNET'; then
            echo 'ERRORE: APK chiede INTERNET' >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomAssistant-v0.3.8
          path: DarkroomAssistant-v0.3.8.apk
