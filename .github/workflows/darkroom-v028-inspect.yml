name: Inspect Darkroom v0.2.7 sources for v0.2.8

on:
  push:
    branches:
      - feature-darkroom-v028-graphic-refresh
    paths-ignore:
      - 'build-output/v028-inspect/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-darkroom-v028-graphic-refresh
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Reconstruct verified v0.2.7 source
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat combined/v015_assets/home_bottom_parts/00.part combined/v015_assets/home_bottom_parts/01.part combined/v015_assets/home_bottom_parts/02.part combined/v015_assets/home_bottom_parts/03.part > combined/v015_assets/home_bottom.jpg
          bash combined/build_v027.sh >/tmp/v028-inspect-build.log 2>&1
          test -f combined/src/main/java/it/darkroom/timer/MainActivity.java

      - name: Save relevant source snapshots
        run: |
          set -euo pipefail
          OUT=build-output/v028-inspect
          mkdir -p "$OUT"
          copy_if() { if [ -f "$1" ]; then cp "$1" "$OUT/$2"; fi; }
          copy_if combined/src/main/java/it/darkroom/timer/MainActivity.java MainActivity-v027.java.txt
          copy_if combined/src/main/java/it/darkroom/timer/home/HomeActivity.java HomeActivity-v027.java.txt
          copy_if combined/src/main/java/it/darkroom/timer/maintenance/UseMaintenanceActivity.java UseMaintenanceActivity-v027.java.txt
          copy_if combined/src/main/java/it/darkroom/timer/EnlargementActivity.java EnlargementActivity-v027.java.txt
          copy_if combined/src/main/java/it/darkroom/assistant/AssistantActivityV2.java AssistantActivityV2-v027.java.txt
          copy_if combined/src/main/AndroidManifest.xml AndroidManifest-v027.xml.txt
          find combined/src/main/res -maxdepth 3 -type f | sort > "$OUT/res-files.txt"
          grep -RInE 'HOME|⌂|home|INDIETRO|IMPOSTAZIONI|Darkroom Timer|AZZERA PIANO|RIMUOVI CORREZIONI|INGRANDITORE|Registrato nella ricetta corrente|RIDIMENSIONA STAMPA|IMPOSTA INGRANDIMENTO|setMinHeight|dp\(' \
            combined/src/main/java/it/darkroom/timer/MainActivity.java \
            combined/src/main/java/it/darkroom/timer/home/HomeActivity.java \
            combined/src/main/java/it/darkroom/timer/maintenance/UseMaintenanceActivity.java \
            combined/src/main/java/it/darkroom/timer/EnlargementActivity.java \
            combined/src/main/java/it/darkroom/assistant/AssistantActivityV2.java \
            > "$OUT/graphic-grep.txt" || true

      - name: Publish inspection snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/v028-inspect
          git commit -m "Capture v0.2.7 sources for graphical refresh [skip ci]" || exit 0
          git push origin HEAD:feature-darkroom-v028-graphic-refresh
