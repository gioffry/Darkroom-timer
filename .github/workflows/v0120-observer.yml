name: Observe Darkroom Timer v0.12.0

on:
  workflow_run:
    workflows: [ "Build Darkroom Timer v0.12.0" ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  record-failure:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0120-darkroom-assistant-r7-r8-r9
          fetch-depth: 0
      - name: Record failed run without retriggering v0120
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v0120
          cat > experiments/v0120/latest_run.txt <<EOF
          run_id=${{ github.event.workflow_run.id }}
          functional_commit=${{ github.event.workflow_run.head_sha }}
          build=FAILURE
          conclusion=${{ github.event.workflow_run.conclusion }}
          html_url=${{ github.event.workflow_run.html_url }}
          EOF
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0120/latest_run.txt
          git commit -m "Record failed v0.12.0 run ${{ github.event.workflow_run.id }} [skip ci]"
          git push origin HEAD:feature-v0120-darkroom-assistant-r7-r8-r9
