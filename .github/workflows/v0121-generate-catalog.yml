name: Generate v0.12.1 Smart Catalog files

on:
  push:
    branches: [ feature-v0121-assistant-ux-smart-catalog ]
    paths:
      - 'experiments/v0121/catalog_data.py'
      - '.github/workflows/v0121-generate-catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0121-assistant-ux-smart-catalog
          fetch-depth: 0
      - name: Generate and validate real versioned catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v0121 catalog
          python3 experiments/v0121/catalog_data.py local > experiments/v0121/catalog-v2.json
          python3 experiments/v0121/catalog_data.py remote > catalog/catalog-v3.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          for path,version,min_records in [(Path('experiments/v0121/catalog-v2.json'),2,30),(Path('catalog/catalog-v3.json'),3,35)]:
              root=json.loads(path.read_text(encoding='utf-8'))
              assert root['catalogVersion']==version and root['schemaVersion']==2
              payload=root['payload']; compact=json.dumps(payload,ensure_ascii=False,separators=(',',':'))
              assert hashlib.sha256(compact.encode()).hexdigest()==root['payloadSha256']
              rows=payload['records']; assert len(rows)>=min_records
              assert len(payload['sources'])>=10
              assert any('aliases' in r and r['aliases'] for r in rows)
              tanks=[r for r in rows if 'TANK' in r['categories']]
              assert len(tanks)>=6 and any(r['name']=='JOBO 2520' for r in tanks)
              films=[r for r in rows if 'FILM' in r['categories']]
              devs=[r for r in rows if 'FILM_DEVELOPER' in r['categories']]
              assert len(films)>=7 and len(devs)>=10
              print(path,'records=',len(rows),'films=',len(films),'developers=',len(devs),'tanks=',len(tanks),'sha=',root['payloadSha256'])
          PY
      - name: Commit generated catalogs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0121/catalog-v2.json catalog/catalog-v3.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate real Smart Catalog v2/v3 [skip ci]"
          git push origin HEAD:feature-v0121-assistant-ux-smart-catalog
