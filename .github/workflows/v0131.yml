name: Build Darkroom Timer v0.13.1

on:
  push:
    branches: [ feature-v0131-fstop-subtractive-teststrip ]
    paths-ignore:
      - 'experiments/v0131/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darkroom-v0131-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v0.13.1 branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0131-fstop-subtractive-teststrip
          fetch-depth: 0

      - name: Prove genealogy from successful Timer-only v0.13.0
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=31c5cbf7323182aa461e2f306a1103f85fae3019
          git fetch origin feature-v0130-timer-only-reset
          BASE_HEAD=$(git rev-parse origin/feature-v0130-timer-only-reset)
          test "$BASE_HEAD" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          MERGE_BASE=$(git merge-base "$BASE_HEAD" HEAD)
          test "$MERGE_BASE" = "$BASE_HEAD"
          FIRST_NEW=$(git rev-list --reverse "$BASE_HEAD"..HEAD | sed -n '1p')
          test -n "$FIRST_NEW"
          test "$(git rev-parse "$FIRST_NEW^")" = "$BASE_HEAD"
          echo "BASE_HEAD=$BASE_HEAD" >> "$GITHUB_ENV"
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

      - name: Reconstruct exact successful v0.13.0 Timer-only image
        shell: bash
        run: |
          set -euo pipefail
          SNAP=base/v0.12.0-materialized
          rm -rf work && mkdir -p work
          cp -a "$SNAP/project" work/project
          cp "$SNAP/build_darkroom.py" work/build_darkroom.py
          cp "$SNAP/v064_icon.py" work/v064_icon.py
          python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work
          python3 experiments/v0122/apply_v0122_real_device_repair.py work
          python3 experiments/v0123/apply_v0123_live_web_repair.py work
          python3 experiments/v0123/apply_v0123_no_manual_cleanup.py work
          python3 experiments/v0130/apply_v0130_timer_only_reset.py work
          grep -q 'android:versionName="0.13.0"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="61"' work/project/app/src/main/AndroidManifest.xml
          test ! -d work/project/app/src/main/java/it/darkroom/timer/assistant
          test ! -d work/project/app/src/main/java/it/darkroom/timer/home

      - name: Fingerprint protected Timer core before timing repair
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          find "$ROOT" -maxdepth 1 -type f -name '*.java' \
            ! -name 'MainActivity.java' ! -name 'TimingMath.java' ! -name 'SonoffArmService.java' \
            -print0 | sort -z | xargs -0 sha256sum > timer-core-before.sha256
          test -s timer-core-before.sha256
          cp "$ROOT/TimingMath.java" /tmp/TimingMath-v0130.java
          cp "$ROOT/SonoffArmService.java" /tmp/SonoffArmService-v0130.java

      - name: Apply v0.13.1 F-STOP a-levare repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0131/apply_v0131_fstop_subtractive_teststrip.py
          python3 experiments/v0131/apply_v0131_fstop_subtractive_teststrip.py work

      - name: Prove scope and Timer-only invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          find "$ROOT" -maxdepth 1 -type f -name '*.java' \
            ! -name 'MainActivity.java' ! -name 'TimingMath.java' ! -name 'SonoffArmService.java' \
            -print0 | sort -z | xargs -0 sha256sum > timer-core-after.sha256
          cmp timer-core-before.sha256 timer-core-after.sha256
          test ! -d "$ROOT/assistant"
          test ! -d "$ROOT/home"
          ! grep -RniE 'assistant|smart search|SVILUPPO & CHIMICA|CHIMICA SESSIONE|paperChemistry' work/project/app/src/main --include='*.java' --include='*.xml'
          grep -q 'subtractivePulses(testTargetsMs)' "$ROOT/SonoffArmService.java"
          grep -q 'Math.pow(QUARTER_STOP_FACTOR, i)' "$ROOT/TimingMath.java"
          grep -q 'SPLIT GRADE' "$ROOT/MainActivity.java"
          grep -q 'PROVINO' "$ROOT/MainActivity.java"
          grep -q 'ARMA' "$ROOT/MainActivity.java"

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute real TimingMath regression tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          rm -rf /tmp/timingtest && mkdir -p /tmp/timingtest
          javac -encoding UTF-8 -d /tmp/timingtest "$ROOT/TimingMath.java" experiments/v0131/TimingMathRegressionTest.java
          java -cp /tmp/timingtest it.darkroom.timer.TimingMathRegressionTest | tee timing-regression.txt
          grep -q 'F-STOP targets from 4.0 s at quarter stop \[4000, 5000, 5500, 6500, 8000, 9500\]' timing-regression.txt
          grep -q 'F-STOP chronological a-levare pulses \[1500, 1500, 1000, 500, 1000, 4000\]' timing-regression.txt
          grep -q 'seconds a-levare pulses unchanged \[4000, 4000, 4000\]' timing-regression.txt
          grep -q 'ALL v0.13.1 TIMING REGRESSIONS PASS' timing-regression.txt

      - name: Prepare Android SDK on GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify final version and expected behavior
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          grep -q 'android:versionName="0.13.1"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="62"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'package="it.darkroom.timer"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'private static final String APP_VERSION = "0.13.1";' "$ROOT/MainActivity.java"
          cat > validation-report.txt <<'EOF'
          release=F-STOP a-levare test-strip repair
          base=successful Timer-only v0.13.0
          Assistant=ABSENT
          seconds_method=UNCHANGED
          seconds_4_8_12_physical_pulses=4_4_4_PASS
          fstop_quarterstop_direct_from_base=PASS
          fstop_4s_targets=4.0_5.0_5.5_6.5_8.0_9.5_PASS
          fstop_a_levare_pulses=1.5_1.5_1.0_0.5_1.0_4.0_PASS
          suffix_sum_final_bands=9.5_8.0_6.5_5.5_5.0_4.0_PASS
          SplitGrade=PASS
          Sonoff=PASS
          PrintLog=PASS
          package=it.darkroom.timer
          versionName=0.13.1
          versionCode=62
          EOF

      - name: Prepare stable signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build sign zipalign verify package version certificate and SHA-256
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="DarkroomTimer-DIY-v0.13.1.apk"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          python3 work/build_darkroom.py work/project --output "$APK" --keystore "$RUNNER_TEMP/darkroom-signing.p12" --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD" >/tmp/darkroom-build.log 2>&1
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK" > zipalign.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > certificate.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='it.darkroom.timer' versionCode='62' versionName='0.13.1'" apk-badging.txt
          CERT_FP=$(grep -m1 'certificate SHA-256 digest:' certificate.txt | sed 's/.*: *//')
          test "$CERT_FP" = "fbead305657584b50a9d8892aa19bd9844b412d77db316e7daa5593c94e2a02f"
          sha256sum "$APK" > apk.sha256
          APK_SHA=$(cut -d' ' -f1 apk.sha256)
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "CERT_FP=$CERT_FP" >> "$GITHUB_ENV"
          {
            echo "build=SUCCESS"
            echo "zipalign=SUCCESS"
            echo "signature=SUCCESS"
            echo "certificate_continuity=PASS"
            echo "certificate_SHA256=$CERT_FP"
            echo "apk_SHA256=$APK_SHA"
            echo "artifact=DarkroomTimer-DIY-v0.13.1"
          } >> validation-report.txt

      - name: Upload v0.13.1 APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v0.13.1
          path: |
            DarkroomTimer-DIY-v0.13.1.apk
            apk.sha256
            certificate.txt
            zipalign.txt
            apk-badging.txt
            timing-regression.txt
            timer-core-before.sha256
            timer-core-after.sha256
            validation-report.txt

      - name: Record successful build metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p experiments/v0131
          cat > experiments/v0131/latest_run.txt <<EOF
          run_id=$GITHUB_RUN_ID
          base_branch=feature-v0130-timer-only-reset
          base_head=$BASE_HEAD
          new_branch=feature-v0131-fstop-subtractive-teststrip
          merge_base=$MERGE_BASE
          functional_commit=$GITHUB_SHA
          versionName=0.13.1
          versionCode=62
          assistant=ABSENT
          seconds_method=UNCHANGED
          fstop_targets=4.0,5.0,5.5,6.5,8.0,9.5
          fstop_a_levare_pulses=1.5,1.5,1.0,0.5,1.0,4.0
          final_bands_dark_to_light=9.5,8.0,6.5,5.5,5.0,4.0
          timing_regression=PASS
          build=SUCCESS
          zipalign=SUCCESS
          signature=SUCCESS
          certificate_continuity=PASS
          certificate_SHA256=$CERT_FP
          artifact=DarkroomTimer-DIY-v0.13.1
          artifact_id=$ARTIFACT_ID
          apk_SHA256=$APK_SHA
          EOF
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0131/latest_run.txt
          git commit -m "Record v0.13.1 F-STOP a-levare build $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:feature-v0131-fstop-subtractive-teststrip
