name: Build Darkroom Timer v0.11.0

on:
  push:
    branches: [ feature-v0110-darkroom-assistant-r5-r6 ]
    paths-ignore:
      - 'experiments/v0110/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: feature-v0110-darkroom-assistant-r5-r6
          fetch-depth: 0

      - name: Prove branch ancestry from v0.10.10
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature-v01010-timer-splitgrade-provini
          BASE_SHA=$(git rev-parse origin/feature-v01010-timer-splitgrade-provini)
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "v0.10.10 baseline ancestor: $BASE_SHA"

      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v0110
          printf 'run_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > experiments/v0110/latest_run.txt
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0110/latest_run.txt
          git commit -m "Record v0.11.0 build run [skip ci]"
          git push origin HEAD:feature-v0110-darkroom-assistant-r5-r6

      - name: Prepare clean Darkroom base
        shell: bash
        run: |
          set -euo pipefail
          test -d base/v0.7.7/project
          rm -rf work && mkdir -p work
          cp -a base/v0.7.7/project work/project
          cp base/v0.7.7/build_darkroom.py work/build_darkroom.py
          cp base/v0.7.7/v064_icon.py work/v064_icon.py

      - name: Apply Timer releases v0.8.0 through v0.10.5
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v080/prepare_v080_transform.py
          python3 experiments/v080/apply_v080_print_sequence.py work
          python3 experiments/v080/apply_v080_fixups.py work
          python3 experiments/v081/prepare_v081_transform.py
          python3 experiments/v081/apply_v081_print_plan_polish.py work
          python3 experiments/v090/prepare_v090_transform.py
          python3 experiments/v090/apply_v090_split_grade.py work
          python3 experiments/v090/apply_v090_fixups.py work
          python3 experiments/v091/prepare_v091_transform.py
          python3 experiments/v091/apply_v091_timing_voice_polish.py work
          python3 experiments/v0100/prepare_v0100_transform.py
          python3 experiments/v0100/apply_v0100_pro_recipe.py work
          python3 experiments/v0101/prepare_v0101_transform.py
          python3 experiments/v0101/apply_v0101_stability_ux.py work
          python3 experiments/v0102/prepare_v0102_transform.py
          python3 experiments/v0102/apply_v0102_test_fixes.py work
          python3 experiments/v0103/prepare_v0103_transform.py
          python3 experiments/v0103/apply_v0103_split_short_exposure.py work
          python3 experiments/v0104/prepare_v0104_transform.py
          python3 experiments/v0104/apply_v0104_dodge_burn_voice.py work
          python3 experiments/v0105/apply_v0105_premature_off_failsafe.py work

      - name: Apply Darkroom Assistant releases 1 through 4
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0106/apply_v0106_darkroom_assistant_r1.py work
          python3 experiments/v0107/apply_v0107_darkroom_assistant_r2.py work
          python3 experiments/v0108/apply_v0108_darkroom_assistant_r3.py work
          python3 experiments/v0109/apply_v0109_darkroom_assistant_r4.py work

      - name: Apply and protect v0.10.10 Timer baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v01010/prepare_v01010_transform.py
          python3 experiments/v01010/apply_v01010_timer_splitgrade_provini.py work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          java=Path('work/project/app/src/main/java/it/darkroom/timer')
          main=(java/'MainActivity.java').read_text(encoding='utf-8')
          split=(java/'SplitGradePlan.java').read_text(encoding='utf-8')
          for n in ['NUOVO PROVINO DA QUESTA STAMPA','ⓘ  COME FUNZIONA','Le due esposizioni NON sono indipendenti','testFromPrint']:
              assert n in main,n
          assert 'public int softYellow = 60;' in split
          assert 'public int hardMagenta = 180;' in split
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in java.glob('*.java') if p.name!='MainActivity.java'}
          Path('/tmp/v01010_timer_hashes.json').write_text(json.dumps(hashes,sort_keys=True))
          Path('/tmp/v01010_main.txt').write_text(main,encoding='utf-8')
          print('v0.10.10 baseline verified and protected')
          PY

      - name: Apply Darkroom Assistant R5 plus R6
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0110/apply_v0110_darkroom_assistant_r5_r6.py experiments/v0110/test_migration_v1_to_v2.py
          python3 experiments/v0110/apply_v0110_darkroom_assistant_r5_r6.py work

      - name: Verify Timer v0.10.10 absolute non-regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          java=Path('work/project/app/src/main/java/it/darkroom/timer')
          before=json.loads(Path('/tmp/v01010_timer_hashes.json').read_text())
          after={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in java.glob('*.java') if p.name!='MainActivity.java'}
          assert before==after, sorted(k for k in set(before)|set(after) if before.get(k)!=after.get(k))
          old=Path('/tmp/v01010_main.txt').read_text(encoding='utf-8')
          now=(java/'MainActivity.java').read_text(encoding='utf-8')
          expected=old.replace('private static final String APP_VERSION = "0.10.10";','private static final String APP_VERSION = "0.11.0";',1)
          assert now==expected,'MainActivity changed beyond version bump'
          for n in ['NUOVO PROVINO DA QUESTA STAMPA','ⓘ  COME FUNZIONA','Le due esposizioni NON sono indipendenti','testFromPrint','showPrintCorrectionEditor','DODGE','BURN']:
              assert n in now,n
          service=(java/'SonoffArmService.java').read_text(encoding='utf-8')
          for n in ['ACTION_ARM_PRINT','ACTION_ARM_TEST','EXTRA_TEST_TARGETS','ACTION_CANCEL']: assert n in service,n
          print('Timer/STAMPA/PROVINI/SPLIT GRADE/SONOFF v0.10.10: REGRESSION OK')
          PY

      - name: Test R2 R3 R4 R5 R6 source behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/project/app/src/main/java/it/darkroom/timer/assistant')
          cat=(root/'development/DevelopmentCatalog.java').read_text(encoding='utf-8')
          chem=(root/'chemistry/ChemistryCalculator.java').read_text(encoding='utf-8')
          result=(root/'development/DevelopmentResultActivity.java').read_text(encoding='utf-8')
          db=(root/'data/AssistantDatabase.java').read_text(encoding='utf-8')
          schema=(root/'data/AssistantDataSchema.java').read_text(encoding='utf-8')
          mychem=(root/'chemistry/inventory/MyChemistryActivity.java').read_text(encoding='utf-8')
          equip=(root/'equipment/MyEquipmentActivity.java').read_text(encoding='utf-8')
          planner=(root/'equipment/TankPlanner.java').read_text(encoding='utf-8')
          newdev=(root/'development/NewDevelopmentActivity.java').read_text(encoding='utf-8')
          log=(root/'log/DevelopmentLogActivity.java').read_text(encoding='utf-8')
          recipes=(root/'recipes/MyRecipesActivity.java').read_text(encoding='utf-8')
          for n in ['DATO DIRETTO','DATO ADATTATO / CALCOLATO','JOBO CPE2','rotazione continua','tempAdjusted * 0.85']: assert n in cat,n
          for n in ['CPE2_MAX_ML = 600.0','NUMERIC_DILUTION','CAPACITY_UNKNOWN','Rapporto di diluizione non ancora disponibile dalla fonte']: assert n in chem,n
          for n in ['findPreferred','recipeFromLog','resetOriginal','sameTemperature','recipes_original_immutable']: assert n in db+schema,n
          for n in ['RIPRISTINA ORIGINALE','PREFERITA']: assert n in recipes,n
          assert 'chooseActiveTime();buildUi();' in result
          assert 'productKnown=c.dilutionKnown' in result and 'waterKnown=c.dilutionKnown' in result
          assert 'Quantità prodotto: non determinata' in log and 'Quantità acqua: non determinata' in log
          for n in ['AGGIUNGI ALLA MIA CHIMICA','PRODOTTO PERSONALE / DATI INSERITI DALL\'UTENTE','DILUIZIONE PERSONALE','CAPACITÀ NON DOCUMENTATA','STORICO UTILIZZI CHIMICA']: assert n in mychem,n
          for n in ['REGISTRA UTILIZZO CHIMICA','solo confermando','nulla verrà sottratto automaticamente']: assert n in result,n
          for n in ['chemical_inventory','chemical_usage','remaining_amount']: assert n in schema,n
          for n in ['JOBO 2520','minRotationMl=270','capacity35=2','capacity120=2','DATI INSERITI DALL\'UTENTE']: assert n in equip,n
          for n in ['chooseBest','cycles','CPE2_MAX_ML','minor volume valido','chimica insufficiente']: assert n in planner,n
          for n in ['SCEGLI TANK','TANK MIGLIORE','chooseTankBest','tankPlanSummary']: assert n in newdev,n
          assert 'DROP TABLE' not in schema and 'DROP TABLE' not in db
          print('R2/R3/R4/R5/R6 static behavior checks: OK')
          PY

      - name: Test R3 chemistry calculations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3classes /tmp/r3src/it/darkroom/timer/assistant/chemistry
          cp work/project/app/src/main/java/it/darkroom/timer/assistant/chemistry/ChemistryCalculator.java /tmp/r3src/it/darkroom/timer/assistant/chemistry/
          cat >/tmp/r3src/TestChem.java <<'JAVA'
          import it.darkroom.timer.assistant.chemistry.ChemistryCalculator;
          public class TestChem { public static void main(String[] a) {
            ChemistryCalculator.Result r=ChemistryCalculator.calculate("FOMA Universal","1+3",340,"120",1);
            if(!r.dilutionKnown || Math.abs(r.productMl-85)>0.001 || Math.abs(r.waterMl-255)>0.001) throw new RuntimeException("FOMA 340/85/255 failed");
            ChemistryCalculator.Result u=ChemistryCalculator.calculate("X","B",340,"120",1);
            if(u.dilutionKnown) throw new RuntimeException("unknown dilution invented");
            if(ChemistryCalculator.CPE2_MAX_ML!=600.0) throw new RuntimeException("CPE2 limit changed");
            System.out.println("R3: FOMA 1+3 340=85+255; UNKNOWN preserved; CPE2=600: OK");
          }}
          JAVA
          javac -d /tmp/r3classes /tmp/r3src/it/darkroom/timer/assistant/chemistry/ChemistryCalculator.java /tmp/r3src/TestChem.java
          java -cp /tmp/r3classes TestChem

      - name: Test SQLite v1 to v2 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0110/test_migration_v1_to_v2.py

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          print(re.search(r'android:versionName="([^"]+)"',t).group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          test "$VERSION_NAME" = "0.11.0"
          grep -q 'android:versionCode="56"' work/project/app/src/main/AndroidManifest.xml

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare stable signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build sign align and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          python3 work/build_darkroom.py work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "DarkroomTimer-DIY-v${VERSION_NAME}.apk")
          echo "$BADGING" | head -30
          echo "$BADGING" | grep -q "package: name='it.darkroom.timer' versionCode='56' versionName='0.11.0'"
          sha256sum "DarkroomTimer-DIY-v${VERSION_NAME}.apk" | tee apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: |
            DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk
            apk.sha256
