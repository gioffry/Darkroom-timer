name: Check Darkroom Timer v0.13.3 source only

on:
  push:
    branches: [ feature-v0133-preferred-strip-pending ]
    paths-ignore:
      - 'experiments/v0133/source_check.txt'

permissions:
  contents: write

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0133-preferred-strip-pending
          fetch-depth: 0

      - name: Reconstruct v0.13.2 source image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work
          cp -a base/v0.12.0-materialized/project work/project
          cp base/v0.12.0-materialized/build_darkroom.py work/build_darkroom.py
          cp base/v0.12.0-materialized/v064_icon.py work/v064_icon.py
          python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work
          python3 experiments/v0122/apply_v0122_real_device_repair.py work
          python3 experiments/v0123/apply_v0123_live_web_repair.py work
          python3 experiments/v0123/apply_v0123_no_manual_cleanup.py work
          python3 experiments/v0130/apply_v0130_timer_only_reset.py work
          python3 experiments/v0131/apply_v0131_fstop_subtractive_teststrip.py work
          python3 experiments/v0132/apply_v0132_consolidated_timer_fixes.py work
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          sha256sum "$ROOT/TimingMath.java" "$ROOT/SonoffArmService.java" > protected-before.sha256

      - name: Apply chooser-only repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0133/apply_v0133_preferred_strip_pending.py
          python3 experiments/v0133/apply_v0133_preferred_strip_pending.py work

      - name: Verify no timing or SONOFF behavior changed
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          sha256sum "$ROOT/TimingMath.java" "$ROOT/SonoffArmService.java" > protected-after.sha256
          cmp protected-before.sha256 protected-after.sha256
          MAIN="$ROOT/MainActivity.java"
          grep -q 'SCEGLI STRISCIA DEL PROVINO' "$MAIN"
          grep -q 'return chosenAt < testAt;' "$MAIN"
          grep -q 'refreshPendingTestStripChoiceUi();' "$MAIN"
          grep -q 'android:versionName="0.13.3"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="64"' work/project/app/src/main/AndroidManifest.xml
          ! grep -RniE 'assistant|smart search|SVILUPPO & CHIMICA' work/project/app/src/main --include='*.java' --include='*.xml'

      - name: Record source-only validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v0133
          cat > experiments/v0133/source_check.txt <<EOF
          run_id=$GITHUB_RUN_ID
          functional_commit=$GITHUB_SHA
          versionName=0.13.3
          versionCode=64
          preferred_strip_pending=PASS
          non_ora_keeps_pending=PASS
          persistent_choose_button=PASS
          next_test_replaces_pending=PASS
          timing_math_unchanged=PASS
          sonoff_service_unchanged=PASS
          apk_built=NO
          source_check=PASS
          EOF
          git config user.name "Darkroom Timer Source Check"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0133/source_check.txt
          git commit -m "Record v0.13.3 source-only check $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:feature-v0133-preferred-strip-pending
