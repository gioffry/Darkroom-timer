name: Audit MacoDirect-gated database

on:
  push:
    branches:
      - feature-darkroom-db-macodirect-master-audit
    paths:
      - 'assistant/db/audit_macodirect_gated_db.py'
      - '.github/workflows/audit_macodirect_gated_db.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit gated database
        run: python3 assistant/db/audit_macodirect_gated_db.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: macodirect-gated-db-audit
          path: build-output/db-postgate-audit/
