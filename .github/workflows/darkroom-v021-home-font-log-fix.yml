name: Build Darkroom v0.2.1 APK

on:
  push:
    branches:
      - feature-darkroom-v021-home-font-log-fix
    paths-ignore:
      - 'build-output/v021/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-darkroom-v021-home-font-log-fix
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Prepare stable signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and validate v0.2.1
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat combined/v015_assets/home_bottom_parts/00.part combined/v015_assets/home_bottom_parts/01.part combined/v015_assets/home_bottom_parts/02.part combined/v015_assets/home_bottom_parts/03.part > combined/v015_assets/home_bottom.jpg

          # build_v021 currently ends with one obsolete check that expects the
          # original resource filename inside the optimized APK. Android/aapt2
          # may rename res/ entries, so we accept that single post-check failure
          # only if the signed APK and all release metadata were actually built.
          set +e
          bash combined/build_v021.sh 2>&1 | tee build-v021.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          test -f Darkroom-v0.2.1.apk
          test -f Darkroom-v0.2.1.sha256
          test -f apk-badging-v015.txt
          test -f validation-v015.txt
          grep -Fq "versionCode='12'" apk-badging-v015.txt
          grep -Fq "versionName='0.2.1'" apk-badging-v015.txt
          grep -Fq "launchable-activity: name='it.darkroom.timer.home.HomeActivity'" apk-badging-v015.txt
          grep -q '^build=SUCCESS$' validation-v015.txt
          grep -q '^home_black_screen_fix=PASS$' validation-v015.txt
          grep -q '^maintenance_font_timer_default=PASS$' validation-v015.txt
          grep -q '^log_visible_paper_size=PASS$' validation-v015.txt
          grep -q '^log_visible_column_height=PASS$' validation-v015.txt
          grep -q '^sonoff_rounding_500ms=PASS$' validation-v015.txt

          # Verify the actual packaged Home image by dimensions/content rather
          # than by its optimized internal filename.
          unzip -Z1 Darkroom-v0.2.1.apk > apk-listing-v021.txt
          FOUND_HOME=0
          while IFS= read -r APK_FILE; do
            case "$APK_FILE" in
              res/*.jpg|res/*.jpeg)
                unzip -p Darkroom-v0.2.1.apk "$APK_FILE" > /tmp/v021-candidate.jpg || continue
                DIMS="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/v021-candidate.jpg 2>/dev/null || true)"
                if [ "$DIMS" = "864x1536" ]; then
                  ffmpeg -v error -xerror -i /tmp/v021-candidate.jpg -frames:v 1 -f null -
                  FOUND_HOME=1
                  echo "PACKAGED_HOME=$APK_FILE ($DIMS)"
                  break
                fi
                ;;
            esac
          done < apk-listing-v021.txt
          test "$FOUND_HOME" -eq 1

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "build_v021 returned $BUILD_RC only because of its obsolete literal resource-name check; packaged-content validation above passed."
          fi
          sha256sum Darkroom-v0.2.1.apk | tee Darkroom-v0.2.1.sha256
          cat validation-v015.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-v0.2.1
          if-no-files-found: error
          path: |
            Darkroom-v0.2.1.apk
            Darkroom-v0.2.1.sha256
            certificate-v015.txt
            apk-badging-v015.txt
            validation-v015.txt
            apk-listing-v021.txt

      - name: Publish build metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build-output/v021
          printf '%s\n' "$GITHUB_RUN_ID" > build-output/v021/run-id.txt
          printf '%s\n' "${{ job.status }}" > build-output/v021/status.txt
          if [ -f Darkroom-v0.2.1.sha256 ]; then cp Darkroom-v0.2.1.sha256 build-output/v021/Darkroom-v0.2.1.sha256; fi
          if [ -f apk-badging-v015.txt ]; then cp apk-badging-v015.txt build-output/v021/apk-badging-v0.2.1.txt; fi
          if [ -f validation-v015.txt ]; then cp validation-v015.txt build-output/v021/validation-v0.2.1.txt; fi
          if [ "${{ job.status }}" != "success" ]; then
            {
              echo 'Darkroom v0.2.1 BUILD FAILED'
              echo "commit=${GITHUB_SHA}"
              echo '--- tail build-v021.log ---'
              if [ -f build-v021.log ]; then tail -n 320 build-v021.log; else echo 'build-v021.log unavailable: failure occurred before build step'; fi
            } > build-output/v021/BUILD_FAILED.txt
          else
            rm -f build-output/v021/BUILD_FAILED.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build-output/v021
          git commit -m "Record Darkroom v0.2.1 build metadata [skip ci]" || exit 0
          git push origin HEAD:feature-darkroom-v021-home-font-log-fix
