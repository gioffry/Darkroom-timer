name: Build Darkroom Combined v0.1.4 HD Home

on:
  push:
    branches:
      - feature-darkroom-v012-vintage-home-r2
  pull_request:
    branches:
      - darkroom-main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkroom-v014-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-darkroom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-darkroom-v012-vintage-home-r2
          fetch-depth: 0

      - name: Prove canonical Darkroom genealogy
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=3246cda0c2356c7cac6da2e08cc2a2bbcd95b9d8
          git fetch origin darkroom-main
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          MERGE_BASE=$(git merge-base "$EXPECTED_BASE" HEAD)
          test "$MERGE_BASE" = "$EXPECTED_BASE"
          grep -q 'Darkroom version: \*\*0.1.1\*\*' CURRENT_STATE.md
          grep -q 'Canonical development branch: \*\*darkroom-main\*\*' CURRENT_STATE.md

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Prepare stable signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and validate Darkroom v0.1.4
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash combined/build_v012.sh
          cat validation-v014.txt

      - name: Upload Darkroom v0.1.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-v0.1.4
          if-no-files-found: error
          path: |
            Darkroom-v0.1.4.apk
            Darkroom-v0.1.4.sha256
            certificate-v014.txt
            apk-badging-v014.txt
            apk-listing-v014.txt
            validation-v014.txt
