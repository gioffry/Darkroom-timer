name: Audit combined Darkroom database v3

on:
  push:
    branches:
      - feature-darkroom-db-macodirect-master-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit combined SQLite catalog
        run: python3 assistant/db/audit_catalog_architecture_current.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: db-architecture-audit-v3
          path: build-output/db-audit/
