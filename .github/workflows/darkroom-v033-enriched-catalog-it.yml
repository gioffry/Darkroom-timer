name: Build Darkroom v0.3.3 Enriched Catalog IT

on:
  push:
    branches:
      - feature-darkroom-v033-enriched-catalog-it
    paths-ignore:
      - 'build-output/v033/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-darkroom-v033-enriched-catalog-it
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Prepare stable signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and validate v0.3.3
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat combined/v015_assets/home_bottom_parts/00.part combined/v015_assets/home_bottom_parts/01.part combined/v015_assets/home_bottom_parts/02.part combined/v015_assets/home_bottom_parts/03.part > combined/v015_assets/home_bottom.jpg
          set +e
          bash combined/build_v033.sh 2>&1 | tee build-v033.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_RC" -ne 0 ]; then exit "$BUILD_RC"; fi
          test -f Darkroom-v0.3.3.apk
          test -f Darkroom-v0.3.3.sha256
          cat validation-v033-enriched.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-v0.3.3
          if-no-files-found: error
          path: |
            Darkroom-v0.3.3.apk
            Darkroom-v0.3.3.sha256
            apk-badging-v033.txt
            apk-listing-v033.txt
            validation-v033-enriched.txt
            developer-db-audit.txt
            macodirect-scope-audit.txt

      - name: Publish build metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build-output/v033
          printf '%s\n' "$GITHUB_RUN_ID" > build-output/v033/run-id.txt
          printf '%s\n' "${{ job.status }}" > build-output/v033/status.txt
          if [ -f Darkroom-v0.3.3.sha256 ]; then cp Darkroom-v0.3.3.sha256 build-output/v033/Darkroom-v0.3.3.sha256; fi
          if [ -f validation-v033-enriched.txt ]; then cp validation-v033-enriched.txt build-output/v033/validation-v0.3.3.txt; fi
          if [ "$${{ job.status }}" != "success" ]; then
            { echo 'Darkroom v0.3.3 BUILD FAILED'; tail -n 500 build-v033.log 2>/dev/null || true; } > build-output/v033/BUILD_FAILED.txt
          else
            rm -f build-output/v033/BUILD_FAILED.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build-output/v033
          git commit -m "Record Darkroom v0.3.3 build metadata [skip ci]" || exit 0
          git push origin HEAD:feature-darkroom-v033-enriched-catalog-it
