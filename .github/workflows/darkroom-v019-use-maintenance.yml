name: Build Darkroom v0.1.9 APK

on:
  push:
    branches:
      - feature-darkroom-v019-use-maintenance
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-darkroom-v019-use-maintenance
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Prepare stable signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and validate v0.1.9
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/darkroom-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat combined/v015_assets/home_bottom_parts/00.part combined/v015_assets/home_bottom_parts/01.part combined/v015_assets/home_bottom_parts/02.part combined/v015_assets/home_bottom_parts/03.part > combined/v015_assets/home_bottom.jpg
          bash combined/build_v019.sh
          test -f Darkroom-v0.1.9.apk
          test -f Darkroom-v0.1.9.sha256
          cat validation-v015.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-v0.1.9
          if-no-files-found: error
          path: |
            Darkroom-v0.1.9.apk
            Darkroom-v0.1.9.sha256
            certificate-v015.txt
            apk-badging-v015.txt
            validation-v015.txt

      - name: Publish verified APK on branch
        if: success()
        run: |
          set -euo pipefail
          mkdir -p build-output/v019
          cp Darkroom-v0.1.9.apk build-output/v019/Darkroom-v0.1.9.apk
          cp Darkroom-v0.1.9.sha256 build-output/v019/Darkroom-v0.1.9.sha256
          cp validation-v015.txt build-output/v019/validation-v0.1.9.txt
          cp apk-badging-v015.txt build-output/v019/apk-badging-v0.1.9.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build-output/v019/Darkroom-v0.1.9.apk build-output/v019/Darkroom-v0.1.9.sha256 build-output/v019/validation-v0.1.9.txt build-output/v019/apk-badging-v0.1.9.txt
          git commit -m "Publish Darkroom v0.1.9 APK [skip ci]"
          git push origin HEAD:feature-darkroom-v019-use-maintenance
