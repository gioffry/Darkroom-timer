name: Build Darkroom Timer v0.8.0

on:
  push:
    branches: [ feature-v080-print-sequence ]
    paths-ignore:
      - 'experiments/v080/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature-v080-print-sequence

      - name: Prepare clean v0.7.7 base
        shell: bash
        run: |
          set -euo pipefail
          test -d base/v0.7.7/project
          rm -rf work && mkdir -p work
          cp -a base/v0.7.7/project work/project
          cp base/v0.7.7/build_darkroom.py work/build_darkroom.py
          cp base/v0.7.7/v064_icon.py work/v064_icon.py

      - name: Apply v0.8.0 print sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v080/apply_v080_print_sequence.py
          python3 experiments/v080/apply_v080_print_sequence.py work

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          print(re.search(r'android:versionName="([^"]+)"',t).group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare stable signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          python3 work/build_darkroom.py work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "DarkroomTimer-DIY-v${VERSION_NAME}.apk" | head -20
          sha256sum "DarkroomTimer-DIY-v${VERSION_NAME}.apk" | tee /tmp/apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk

      - name: Record successful run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v080
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "job=build-apk"
            echo "version=${{ steps.version.outputs.name }}"
            echo "commit=${GITHUB_SHA}"
            cat /tmp/apk.sha256
          } > experiments/v080/latest_run.txt
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v080/latest_run.txt
          git commit -m "Record successful v0.8.0 build [skip ci]"
          git push origin HEAD:feature-v080-print-sequence
