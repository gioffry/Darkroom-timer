name: Diagnose Build Darkroom Timer v0.12.3

on:
  push:
    branches: [ feature-v0123-assistant-live-web-repair ]
    paths-ignore:
      - 'experiments/v0123/build_diagnostic.txt'
      - 'experiments/v0123/diagnostic.txt'
      - 'experiments/v0123/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0123-assistant-live-web-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and always record diagnostic
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          FAIL=""
          rm -rf work && mkdir -p work
          cp -a base/v0.12.0-materialized/project work/project || FAIL="copy_base"
          cp base/v0.12.0-materialized/build_darkroom.py work/build_darkroom.py || FAIL="copy_builder"
          cp base/v0.12.0-materialized/v064_icon.py work/v064_icon.py || FAIL="copy_icon"
          if [ -z "$FAIL" ]; then python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work > builddiag-transform.txt 2>&1 || FAIL="apply_v0121"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0122/apply_v0122_real_device_repair.py work >> builddiag-transform.txt 2>&1 || FAIL="apply_v0122"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0123/apply_v0123_live_web_repair.py work >> builddiag-transform.txt 2>&1 || FAIL="apply_v0123"; fi
          if [ -z "$FAIL" ]; then python3 experiments/v0123/apply_v0123_no_manual_cleanup.py work >> builddiag-transform.txt 2>&1 || FAIL="cleanup"; fi
          if [ -z "$FAIL" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"; "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > builddiag-sdk.txt 2>&1 || FAIL="sdk"; fi
          if [ -z "$FAIL" ]; then printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12" || FAIL="keystore"; fi
          if [ -z "$FAIL" ]; then python3 work/build_darkroom.py work/project --output DarkroomTimer-DIY-v0.12.3.apk --keystore "$RUNNER_TEMP/darkroom-signing.p12" --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD" > builddiag-build.txt 2>&1 || FAIL="build"; fi
          mkdir -p experiments/v0123
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            if [ -z "$FAIL" ]; then echo "status=PASS"; else echo "status=FAIL"; echo "failed_stage=$FAIL"; fi
            for f in builddiag-transform.txt builddiag-sdk.txt builddiag-build.txt; do if [ -f "$f" ]; then echo "--- $f ---"; tail -120 "$f"; fi; done
          } > experiments/v0123/build_diagnostic.txt
          git config user.name "Darkroom Timer Build Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0123/build_diagnostic.txt
          git commit -m "Record v0.12.3 build diagnostic $GITHUB_RUN_ID [skip ci]" || true
          git push origin HEAD:feature-v0123-assistant-live-web-repair || true
          exit 0
