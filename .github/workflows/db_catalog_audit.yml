name: Audit Darkroom database architecture

on:
  push:
    branches:
      - feature-darkroom-db-macodirect-master-audit
    paths:
      - 'assistant/db/audit_catalog_architecture_current.py'
      - '.github/workflows/db_catalog_audit.yml'
      - 'combined/src/main/assets/mdc_full.sqlite'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current SQLite catalog architecture
        run: python3 assistant/db/audit_catalog_architecture_current.py
      - name: Upload database audit
        uses: actions/upload-artifact@v4
        with:
          name: db-architecture-audit
          path: build-output/db-audit/
