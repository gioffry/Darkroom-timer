name: Check Darkroom Timer v0.13.7 source only

on:
  push:
    branches: [ feature-v0137-flat-bottom-nav ]
    paths-ignore:
      - 'experiments/v0137/source_check.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v0137-flat-bottom-nav
          fetch-depth: 0

      - name: Reconstruct exact v0.13.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work
          cp -a base/v0.12.0-materialized/project work/project
          cp base/v0.12.0-materialized/build_darkroom.py work/build_darkroom.py
          cp base/v0.12.0-materialized/v064_icon.py work/v064_icon.py
          python3 experiments/v0121/apply_v0121_assistant_ux_smart_catalog.py work
          python3 experiments/v0122/apply_v0122_real_device_repair.py work
          python3 experiments/v0123/apply_v0123_live_web_repair.py work
          python3 experiments/v0123/apply_v0123_no_manual_cleanup.py work
          python3 experiments/v0130/apply_v0130_timer_only_reset.py work
          python3 experiments/v0131/apply_v0131_fstop_subtractive_teststrip.py work
          python3 experiments/v0132/apply_v0132_consolidated_timer_fixes.py work
          python3 experiments/v0133/apply_v0133_preferred_strip_pending.py work
          python3 experiments/v0134/apply_v0134_preferred_strip_button_fix.py work
          python3 experiments/v0135/apply_v0135_provino_contrast_note.py work
          python3 experiments/v0136/apply_v0136_bottom_nav_provino_first.py work
          grep -q 'android:versionName="0.13.6"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="67"' work/project/app/src/main/AndroidManifest.xml
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          sha256sum "$ROOT/TimingMath.java" | cut -d' ' -f1 > /tmp/timing.before
          sha256sum "$ROOT/SonoffArmService.java" | cut -d' ' -f1 > /tmp/sonoff.before

      - name: Apply v0.13.7 flat bottom nav
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0137/apply_v0137_flat_bottom_nav.py
          python3 experiments/v0137/apply_v0137_flat_bottom_nav.py work
          ROOT=work/project/app/src/main/java/it/darkroom/timer
          MAIN="$ROOT/MainActivity.java"
          NAV="$ROOT/PrimaryNavButton.java"
          grep -q 'android:versionName="0.13.7"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'android:versionCode="68"' work/project/app/src/main/AndroidManifest.xml
          grep -q 'page.addView(bottomNavDivider, lp(-1, dp(1)));' "$MAIN"
          grep -q 'page.addView(modeRow, lp(-1, dp(78)));' "$MAIN"
          grep -q 'button.setBackgroundColor(Color.TRANSPARENT);' "$MAIN"
          grep -q 'setActiveIndicator(selected, foreground)' "$MAIN"
          grep -q 'setActiveIndicator(boolean active, int color)' "$NAV"
          grep -q 'canvas.drawLine(cx - d(18), d(2), cx + d(18), d(2), paint);' "$NAV"
          grep -q 'mode = MODE_TEST;' "$MAIN"
          grep -q 'Leggi il provino dal CHIARO allo SCURO:' "$MAIN"
          grep -q 'maybeShowTestResultChooser(true)' "$MAIN"
          test "$(cat /tmp/timing.before)" = "$(sha256sum "$ROOT/TimingMath.java" | cut -d' ' -f1)"
          test "$(cat /tmp/sonoff.before)" = "$(sha256sum "$ROOT/SonoffArmService.java" | cut -d' ' -f1)"

      - name: Record source-only verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v0137
          cat > experiments/v0137/source_check.txt <<EOF
          run_id=$GITHUB_RUN_ID
          versionName=0.13.7
          versionCode=68
          flat_bottom_nav=PASS
          card_backgrounds_removed=PASS
          active_top_indicator=PASS
          nav_order=PROVINO,STAMPA,LOG
          default_provino=PASS
          contrast_note=PRESERVED
          preferred_strip_manual_fix=PRESERVED
          timing_math_unchanged=PASS
          sonoff_service_unchanged=PASS
          apk_built=NO
          source_check=PASS
          EOF
          git config user.name "Darkroom Timer Source Check"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0137/source_check.txt
          git commit -m "Record v0.13.7 source-only check $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:feature-v0137-flat-bottom-nav
