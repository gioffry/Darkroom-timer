name: Build Darkroom Timer v0.10.8

on:
  push:
    branches: [ feature-v0108-darkroom-assistant-r3 ]
    paths-ignore:
      - 'experiments/v0108/latest_run.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature-v0108-darkroom-assistant-r3

      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/v0108
          printf 'run_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > experiments/v0108/latest_run.txt
          git config user.name "Darkroom Timer Builder"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/v0108/latest_run.txt
          git commit -m "Record v0.10.8 build run [skip ci]"
          git push origin HEAD:feature-v0108-darkroom-assistant-r3

      - name: Prepare clean Darkroom base
        shell: bash
        run: |
          set -euo pipefail
          test -d base/v0.7.7/project
          rm -rf work && mkdir -p work
          cp -a base/v0.7.7/project work/project
          cp base/v0.7.7/build_darkroom.py work/build_darkroom.py
          cp base/v0.7.7/v064_icon.py work/v064_icon.py

      - name: Apply v0.8.0 print sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v080/prepare_v080_transform.py
          python3 -m py_compile experiments/v080/apply_v080_print_sequence.py experiments/v080/apply_v080_fixups.py
          python3 experiments/v080/apply_v080_print_sequence.py work
          python3 experiments/v080/apply_v080_fixups.py work

      - name: Apply v0.8.1 print plan polish
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v081/prepare_v081_transform.py
          python3 -m py_compile experiments/v081/apply_v081_print_plan_polish.py
          python3 experiments/v081/apply_v081_print_plan_polish.py work

      - name: Apply v0.9.0 Split Grade
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v090/prepare_v090_transform.py
          python3 -m py_compile experiments/v090/apply_v090_split_grade.py experiments/v090/apply_v090_fixups.py
          python3 experiments/v090/apply_v090_split_grade.py work
          python3 experiments/v090/apply_v090_fixups.py work

      - name: Apply v0.9.1 timing and voice polish
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v091/prepare_v091_transform.py
          python3 -m py_compile experiments/v091/apply_v091_timing_voice_polish.py
          python3 experiments/v091/apply_v091_timing_voice_polish.py work

      - name: Apply v0.10.0 PRO recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0100/prepare_v0100_transform.py
          python3 -m py_compile experiments/v0100/apply_v0100_pro_recipe.py
          python3 experiments/v0100/apply_v0100_pro_recipe.py work

      - name: Apply v0.10.1 stability and UX
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0101/prepare_v0101_transform.py
          python3 -m py_compile experiments/v0101/apply_v0101_stability_ux.py
          python3 experiments/v0101/apply_v0101_stability_ux.py work

      - name: Apply v0.10.2 test and safelight fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0102/prepare_v0102_transform.py
          python3 -m py_compile experiments/v0102/apply_v0102_test_fixes.py
          python3 experiments/v0102/apply_v0102_test_fixes.py work

      - name: Apply v0.10.3 split and short exposure fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0103/prepare_v0103_transform.py
          python3 -m py_compile experiments/v0103/apply_v0103_split_short_exposure.py
          python3 experiments/v0103/apply_v0103_split_short_exposure.py work

      - name: Apply v0.10.4 dodge burn voice
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/v0104/prepare_v0104_transform.py
          python3 -m py_compile experiments/v0104/apply_v0104_dodge_burn_voice.py
          python3 experiments/v0104/apply_v0104_dodge_burn_voice.py work

      - name: Apply v0.10.5 premature OFF fail-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0105/apply_v0105_premature_off_failsafe.py
          python3 experiments/v0105/apply_v0105_premature_off_failsafe.py work

      - name: Apply v0.10.6 Darkroom Assistant release 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0106/apply_v0106_darkroom_assistant_r1.py
          python3 experiments/v0106/apply_v0106_darkroom_assistant_r1.py work

      - name: Apply v0.10.7 Darkroom Assistant release 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0107/apply_v0107_darkroom_assistant_r2.py
          python3 experiments/v0107/apply_v0107_darkroom_assistant_r2.py work

      - name: Apply v0.10.8 Darkroom Assistant release 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/v0108/apply_v0108_darkroom_assistant_r3.py
          python3 experiments/v0108/apply_v0108_darkroom_assistant_r3.py work

      - name: Test R2 time engine and R3 chemistry engine
        shell: bash
        run: |
          set -euo pipefail
          CAT="work/project/app/src/main/java/it/darkroom/timer/assistant/development/DevelopmentCatalog.java"
          CHEM="work/project/app/src/main/java/it/darkroom/timer/assistant/chemistry/ChemistryCalculator.java"
          rm -rf /tmp/darkroom-r3 && mkdir -p /tmp/darkroom-r3
          javac -d /tmp/darkroom-r3 "$CAT" "$CHEM"
          cat > /tmp/TestDarkroomR3.java <<'JAVA'
          import it.darkroom.timer.assistant.development.DevelopmentCatalog;
          import it.darkroom.timer.assistant.chemistry.ChemistryCalculator;
          public final class TestDarkroomR3 {
              private static void ok(boolean v, String m) { if(!v) throw new AssertionError(m); }
              private static void close(double a,double b,String m){ if(Math.abs(a-b)>0.06) throw new AssertionError(m+": "+a+" != "+b); }
              public static void main(String[] args) {
                  DevelopmentCatalog.Result direct=DevelopmentCatalog.calculate(
                      "KODAK TRI-X 400","35 mm",400,"KODAK D-76","stock",20.0);
                  ok(direct.ok && direct.finalSeconds==405,"R2 TRI-X rotary 6:45 regression");
                  ok(direct.dataType.contains("DIRETTO"),"R2 direct/source regression");
                  DevelopmentCatalog.Result cross=DevelopmentCatalog.calculate(
                      "Fomapan 100 Classic","120",100,"KODAK D-76","stock",20.0);
                  ok(cross.ok && cross.dataType.contains("ADATTATO"),"R2 cross-brand regression");
                  DevelopmentCatalog.Result push=DevelopmentCatalog.calculate(
                      "ILFORD HP5 PLUS","120",1600,"KODAK D-76","stock",21.7);
                  ok(push.ok && push.calculation.contains("−15%"),"R2 temperature/rotary disclosure regression");

                  ChemistryCalculator.Result one=ChemistryCalculator.calculate("FOMA Universal","1+3",340,"120",1);
                  ok(one.inputValid && one.dilutionKnown,"1+3 should calculate");
                  close(one.productMl,85.0,"340 @1+3 stock"); close(one.waterMl,255.0,"340 @1+3 water");
                  ok(ChemistryCalculator.CAPACITY_VERIFIED.equals(one.capacityState),"FOMA Universal 340ml/1 roll capacity should verify");

                  ChemistryCalculator.Result stock=ChemistryCalculator.calculate("KODAK D-76","stock",340,"35 mm",1);
                  close(stock.productMl,340.0,"stock product"); close(stock.waterMl,0.0,"stock water");
                  ok(ChemistryCalculator.CAPACITY_UNKNOWN.equals(stock.capacityState),"D-76 capacity must remain unknown without source metadata");

                  ChemistryCalculator.Result r11=ChemistryCalculator.calculate("TEST","1+1",340,"120",0);
                  close(r11.productMl,170.0,"1+1 product"); close(r11.waterMl,170.0,"1+1 water");
                  ChemistryCalculator.Result r19=ChemistryCalculator.calculate("TEST","1+9",500,"120",0);
                  close(r19.productMl,50.0,"1+9 product"); close(r19.waterMl,450.0,"1+9 water");
                  ChemistryCalculator.Result r119=ChemistryCalculator.calculate("TEST","1+19",200,"120",0);
                  close(r119.productMl,10.0,"1+19 product"); close(r119.waterMl,190.0,"1+19 water");
                  ChemistryCalculator.Result r125=ChemistryCalculator.calculate("TEST","1+25",260,"120",0);
                  close(r125.productMl,10.0,"1+25 product"); close(r125.waterMl,250.0,"1+25 water");
                  ChemistryCalculator.Result r150=ChemistryCalculator.calculate("TEST","1+50",510,"120",0);
                  close(r150.productMl,10.0,"1+50 product"); close(r150.waterMl,500.0,"1+50 water");

                  ChemistryCalculator.Result nominal=ChemistryCalculator.calculate("KODAK HC-110","B",340,"120",1);
                  ok(!nominal.dilutionKnown,"nominal B must not invent a ratio");
                  ok(nominal.dilutionMessage.contains("non ancora disponibile"),"nominal dilution warning missing");

                  ChemistryCalculator.Result low=ChemistryCalculator.calculate("FOMA Universal","1+3",300,"120",1);
                  ok(ChemistryCalculator.CAPACITY_INSUFFICIENT.equals(low.capacityState),"300ml should be insufficient from FOMA 4000/12 capacity");
                  close(low.minimumVolumeMl,4000.0/12.0,"minimum one roll"); ok(low.canAdoptMinimum,"one roll minimum should be adoptable");
                  ChemistryCalculator.Result two=ChemistryCalculator.calculate("FOMA Universal","1+3",500,"120",2);
                  close(two.minimumVolumeMl,2.0*4000.0/12.0,"minimum two rolls");
                  ok(!two.canAdoptMinimum,"minimum over 600ml must not be proposed for CPE2");
                  ok(ChemistryCalculator.CPE2_MAX_ML==600.0,"CPE2 limit changed");
                  System.out.println("Darkroom Assistant R3 calculation tests OK");
              }
          }
          JAVA
          javac -cp /tmp/darkroom-r3 -d /tmp/darkroom-r3 /tmp/TestDarkroomR3.java
          java -cp /tmp/darkroom-r3 TestDarkroomR3

      - name: Verify Home, navigation and Assistant R3 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work/project/app/src/main')
          manifest=(root/'AndroidManifest.xml').read_text(encoding='utf-8')
          java=root/'java/it/darkroom/timer'
          main=(java/'MainActivity.java').read_text(encoding='utf-8')
          home=(java/'home/HomeActivity.java').read_text(encoding='utf-8')
          assistant=(java/'assistant/AssistantActivity.java').read_text(encoding='utf-8')
          newdev=(java/'assistant/development/NewDevelopmentActivity.java').read_text(encoding='utf-8')
          result=(java/'assistant/development/DevelopmentResultActivity.java').read_text(encoding='utf-8')
          prepare=(java/'assistant/chemistry/PrepareChemistryActivity.java').read_text(encoding='utf-8')
          assert manifest.count('android.intent.action.MAIN') == 1
          assert manifest.count('android.intent.category.LAUNCHER') == 1
          assert '.home.HomeActivity' in manifest and 'MainActivity.class' in home and 'AssistantActivity.class' in home
          assert 'compactButton("← HOME")' in main and 'homeButton.setOnClickListener(v -> finish())' in main
          assert 'assistant.AssistantActivity.class' not in main
          assert 'PrepareChemistryActivity.class' in assistant and '.assistant.chemistry.PrepareChemistryActivity' in manifest
          assert 'NUMERO RULLI' in newdev and 'VOLUME TOTALE DA PREPARARE' in newdev
          assert 'TEMPO DA IMPOSTARE SUL TIMER' in result and 'PREPARA' in result
          assert 'JOBO CPE2' in newdev and 'JOBO CPE2' in result and 'JOBO CPE2' in prepare
          assert 'package="it.darkroom.timer"' in manifest
          print('Home / STAMPA / Assistant R3 integration checks OK')
          PY

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('work/project/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          print(re.search(r'android:versionName="([^"]+)"',t).group(1))
          PY
          )
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          test "$VERSION_NAME" = "0.10.8"

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare stable signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkroom-signing.p12"

      - name: Build and sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          python3 work/build_darkroom.py work/project \
            --output "DarkroomTimer-DIY-v${VERSION_NAME}.apk" \
            --keystore "$RUNNER_TEMP/darkroom-signing.p12" \
            --alias "$KEY_ALIAS" --storepass "$KEYSTORE_PASSWORD" --keypass "$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "DarkroomTimer-DIY-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "DarkroomTimer-DIY-v${VERSION_NAME}.apk" | head -30
          sha256sum "DarkroomTimer-DIY-v${VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}
          path: DarkroomTimer-DIY-v${{ steps.version.outputs.name }}.apk
