plugins {
    id 'com.android.application'
}

android {
    namespace 'app.diariopercorsi.stabile'
    compileSdk 35

    signingConfigs {
        stable {
            storeFile rootProject.file('signing/diario-percorsi.jks')
            storePassword 'android'
            keyAlias 'diario'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'app.diariopercorsi.stabile'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.6.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }
}
